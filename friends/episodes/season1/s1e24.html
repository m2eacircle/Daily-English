    {
      phrase: 'I\'m going to China.',
      partOfSpeech: 'expression',
      meaning: 'A statement announcing an immediate travel plan or commitment. The phrase conveys a definitive decision to depart. It\'s a straightforward declaration of intention or necessity to go somewhere, often accompanied by a sense of finality or resignation.',
      meaning_ko: '즉각적인 여행 계획이나 약속을 발표하는 진술입니다. 이 표현은 출발에 대한 명확한 결정을 전달합니다. 그것은 어딘가에 가려는 의도나 필요에 대한 직설적인 선언이며, 종종 최종성이나 체념의 감각을 동반합니다.',

      example_ko: 'A: "넌 어디로 가?" B: "난 중국에 가."',
      context: 'Ross announces his museum research trip to China during the barbecue with friends.',
      context_ko: 'Ross는 친구들과의 바비큐 중에 중국으로의 박물관 연구 여행을 발표합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X1'
    },
    {
      phrase: 'Is he just the sweetest thing?',
      partOfSpeech: 'question',
      meaning: 'An enthusiastic exclamation in question form expressing admiration and affection for someone, usually a baby or young child. The phrase conveys genuine warmth and tenderness. It\'s a rhetorical question expecting agreement rather than an actual answer.',
      meaning_ko: '누군가를 칭찬하고 애정을 표현하는 질문 형식의 열정적인 감탄입니다. 일반적으로 아기 또는 어린이입니다. 이 표현은 진정한 따뜻함과 부드러움을 전달합니다. 그것은 실제 답변보다는 동의를 기대하는 수사적 질문입니다.',

      context: 'Rachel admires newborn Ben at the barbecue, expressing tender affection for her friend\'s baby.',
      context_ko: 'Rachel은 바비큐에서 새로 태어난 Ben을 감탄하며, 그녀 친구의 아기에 대한 부드러운 애정을 표현합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X2'
    },
    {
      phrase: 'It\'s a fertility study.',
      partOfSpeech: 'expression',
      meaning: 'A brief factual disclosure revealing the nature or purpose of something. The phrase provides clarification or explanation when pressed for details. It conveys information straightforwardly without elaboration or embellishment.',
      meaning_ko: '뭔가의 특성이나 목적을 드러내는 간단한 사실 공개입니다. 이 표현은 세부 정보에 대해 묻혔을 때 명확성이나 설명을 제공합니다. 그것은 정보를 직설적으로 전달하며 정교하거나 미화하지 않습니다.',

      context: 'Ross clarifies to others the nature of Joey\'s participation in the medical study.',
      context_ko: 'Ross는 Joey의 의료 연구 참여의 특성을 다른 사람들에게 명확히 합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X3'
    },
    {
      phrase: 'I\'ve been in love with you since the ninth grade.',
      partOfSpeech: 'expression',
      meaning: 'A profound confession of long-standing romantic feelings or attachment. The phrase reveals deep, enduring emotion that has persisted over years. It conveys vulnerability and the significance of the feeling by anchoring it to a specific distant time.',
      meaning_ko: '오래 지속된 낭만적 감정이나 애착에 대한 심오한 고백입니다. 이 표현은 수년에 걸쳐 지속된 깊고 지속적인 감정을 드러냅니다. 그것은 특정한 먼 시간에 그 느낌을 고정함으로써 취약성과 느낌의 중요성을 전달합니다.',
      example: 'A: "When did you start liking me?" B: "I\'ve been in love with you since ninth grade."',
      example_ko: 'A: "넌 언제부터 나를 좋아했어?" B: "난 9학년 때부터 너를 사랑했어."',
      context: 'Ross makes his emotional confession to Rachel at the airport, revealing his long-hidden feelings.',
      context_ko: 'Ross는 공항에서 Rachel에게 감정적인 고백을 하며, 그의 오랫동안 숨겨진 감정을 드러냅니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X4'
    },
    {
      phrase: 'You\'re, like, my best friend.',
      partOfSpeech: 'expression',
      meaning: 'A statement emphasizing the deep non-romantic bond and closeness with someone. The phrase conveys that the person holds a special, invaluable place in one\'s life. It\'s used to express irreplaceability and the importance of the friendship itself.',
      meaning_ko: '누군가와의 깊은 낭만적이지 않은 유대 관계와 가까움을 강조하는 진술입니다. 이 표현은 그 사람이 자신의 삶에서 특별하고 귀중한 자리를 차지하고 있다는 것을 전달합니다. 그것은 대체 불가능성과 우정 자체의 중요성을 표현하기 위해 사용됩니다.',
      example: 'A: "I don\'t want to lose you." B: "You\'re my best friend. I can\'t lose that."',
      example_ko: 'A: "난 넌 잃고 싶지 않아." B: "넌 내 친구야. 난 그걸 잃을 수 없어."',
      context: 'Rachel expresses her fear about dating Ross, emphasizing how important their friendship is.',
      context_ko: 'Rachel은 Ross와의 데이트에 대한 공포를 표현하며, 그들의 우정이 얼마나 중요한지를 강조합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X5'
    },
    {
      phrase: 'But it only has to happen once.',
      partOfSpeech: 'expression',
      meaning: 'An encouraging statement suggesting that one success or positive outcome negates the possibility of inevitable failure. The phrase conveys hope and the power of possibility. It\'s used to counter pessimistic thinking with the potential for one good result.',
      meaning_ko: '한 번의 성공이나 긍정적인 결과가 필연적인 실패의 가능성을 무효화한다고 제안하는 격려적 진술입니다. 이 표현은 희망과 가능성의 힘을 전달합니다. 그것은 한 가지 좋은 결과의 가능성을 가지고 비관적인 사고에 대항하는 데 사용됩니다.',
      example: 'A: "What if we break up?" B: "But it only has to happen once—us staying together forever."',
      example_ko: 'A: "우리가 헤어지면 어떻게 해?" B: "하지만 그건 한 번만 일어나면 돼—우리가 영원히 함께하는 것."',
      context: 'Rachel responds to Ross\' concerns about their relationship failing, offering hope.',
      context_ko: 'Rachel은 그들의 관계가 실패할 것에 대한 Ross의 우려에 대응하여 희망을 제공합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X6'
    },
    {
      phrase: 'You and I know we are perfect for each other.',
      partOfSpeech: 'expression',
      meaning: 'A confident assertion that two people are ideally matched and compatible. The phrase expresses certainty about relationship compatibility. It\'s a statement of conviction that the pair shares a special connection or destiny together.',
      meaning_ko: '두 사람이 이상적으로 어울리고 양립 가능하다는 자신 있는 주장입니다. 이 표현은 관계 양립에 대한 확실성을 표현합니다. 그것은 그 쌍이 특별한 연결이나 함께의 운명을 공유한다는 확신의 진술입니다.',
      example: 'A: "Why should we try this?" B: "You and I know we\'re perfect for each other."',
      example_ko: 'A: "왜 우리가 이걸 시도해야 해?" B: "너와 난 우리가 서로 완벽하다는 걸 알아."',
      context: 'Ross makes his final argument to Rachel about why they should be together.',
      context_ko: 'Ross는 Rachel에게 그들이 함께 있어야 하는 이유에 대해 최종 주장을 합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X7'
    },
    {
      phrase: 'Are you attracted to me?',
      partOfSpeech: 'question',
      meaning: 'A direct, vulnerable inquiry about physical or romantic attraction. The phrase cuts to the heart of a relationship concern. It\'s a straightforward question seeking honest clarification about whether someone experiences sexual or romantic interest.',
      meaning_ko: '신체적 또는 낭만적 매력에 대한 직접적이고 취약한 조회입니다. 이 표현은 관계 우려의 핵심을 자릅니다. 그것은 누군가가 성적 또는 낭만적 관심을 경험하는지에 대한 정직한 명확성을 추구하는 직설적인 질문입니다.',
      example: 'A: "I don\'t know if this would work." B: "Are you attracted to me?"',
      example_ko: 'A: "난 이게 작동할지 모르겠어." B: "넌 나한테 끌려?"',
      context: 'Ross directly asks Rachel if she finds him physically attractive, pushing for clarity.',
      context_ko: 'Ross는 Rachel에게 자신이 신체적으로 매력적인지 직접 묻고, 명확성을 밀어붙입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X8'
    },
    {
      phrase: 'I mean, I\'ve never looked at you that way before.',
      partOfSpeech: 'expression',
      meaning: 'A candid admission that one has not previously experienced romantic or sexual feelings toward another person. The phrase conveys honest unfamiliarity with attraction. It\'s used to explain a lack of prior interest without suggesting permanent impossibility.',
      meaning_ko: '누군가 다른 사람에 대해 이전에 낭만적 또는 성적 감정을 경험하지 않았다는 솔직한 인정입니다. 이 표현은 매력에 대한 정직한 부족함을 전달합니다. 그것은 영구적 불가능을 시사하지 않으면서 사전 관심의 부족을 설명하기 위해 사용됩니다.',
      example: 'A: "Could you see yourself with me?" B: "I\'ve never looked at you that way before."',
      example_ko: 'A: "넌 자신을 나와 함께 볼 수 있어?" B: "난 전에 너를 그렇게 본 적이 없어."',
      context: 'Rachel honestly tells Ross that she has not previously considered him romantically.',
      context_ko: 'Rachel은 Ross에게 그녀가 이전에 그를 낭만적으로 고려한 적이 없다고 정직하게 말합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X9'
    },
    {
      phrase: 'Well start looking.',
      partOfSpeech: 'expression',
      meaning: 'An instruction or challenge to begin perceiving or reconsidering someone in a new way. The phrase encourages someone to shift their perspective or awareness. It\'s a directive to actively engage in examining or changing one\'s feelings.',
      meaning_ko: '누군가를 새로운 방식으로 인식하거나 재고하기 시작하도록 하는 지시 또는 도전입니다. 이 표현은 관점이나 인식을 바꾸도록 장려합니다. 그것은 자신의 느낌을 검토하거나 변경하는 데 적극적으로 참여하도록 하는 지시입니다.',
      example: 'A: "I\'ve never thought of you that way." B: "Well, start looking."',
      example_ko: 'A: "난 너를 그렇게 생각한 적이 없어." B: "그럼 봐 봐."',
      context: 'Ross challenges Rachel to reconsider him romantically, pushing her to see him differently.',
      context_ko: 'Ross는 Rachel에게 자신을 낭만적으로 재고하도록 도전하며, 그녀가 자신을 다르게 보도록 밀어붙입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X10'
    },
    {
      phrase: 'Forget about her.',
      partOfSpeech: 'expression',
      meaning: 'An instruction to stop thinking about, dwelling on, or pursuing someone. The phrase urges emotional disengagement or acceptance of loss. It\'s often used as well-intentioned advice to help someone move past unrequited feelings or unhealthy attachment.',
      meaning_ko: '누군가를 생각하거나 집착하거나 추구하는 것을 멈추도록 하는 지시입니다. 이 표현은 감정적 분리 또는 손실 수용을 촉구합니다. 그것은 종종 누군가가 편향된 감정이나 건강하지 않은 애착을 넘어 가도록 돕기 위한 선의의 조언으로 사용됩니다.',
      example: 'A: "I can\'t stop thinking about her." B: "Forget about her. Move on."',
      example_ko: 'A: "난 그녀를 그만 생각할 수 없어." B: "그냥 그녀를 잊어. 계속해."',

      context_ko: 'Chandler과 Joey는 Ross에게 Rachel에 대해 열망하는 것을 멈추고 계속하도록 설득하려고 합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X11'
    },
    {
      phrase: 'I want you to be happy.',
      partOfSpeech: 'expression',
      meaning: 'A sincere declaration of caring about someone\'s wellbeing and contentment. The phrase expresses genuine affection and priority for another\'s happiness. It\'s often used to demonstrate unconditional support even when it means accepting someone\'s choice for their own good.',
      meaning_ko: '누군가의 안녕과 만족에 대해 돌보는 것을 진실로 선언하는 것입니다. 이 표현은 다른 사람의 행복에 대한 진정한 애정과 우선순위를 표현합니다. 그것은 누군가가 자신의 이익을 위해 자신의 선택을 받아들이는 것을 의미하더라도 무조건적인 지원을 보여주기 위해 자주 사용됩니다.',
      example: 'A: "Even if it\'s with someone else?" B: "I want you to be happy."',

      context: 'Chandler tells Ross he wants him to be happy, even though it concerns Rachel.',
      context_ko: 'Chandler은 Ross에게 Rachel에 대해 걱정하는데도 불구하고 그를 행복하기를 원한다고 말합니다.',

    },
    {
      phrase: 'I\'ve decided this Ross thing is not a good idea.',
      partOfSpeech: 'expression',
      meaning: 'A firm personal decision statement indicating a negative conclusion about a relationship possibility. The phrase conveys definitive choice and reasoning. It\'s used to announce a resolution after careful consideration of whether to pursue a romantic relationship.',
      meaning_ko: '관계 가능성에 대한 부정적인 결론을 나타내는 확실한 개인적 결정 진술입니다. 이 표현은 명확한 선택과 추론을 전달합니다. 그것은 낭만적 관계를 추구할지 여부에 대한 신중한 고려 후 해결책을 발표하는 데 사용됩니다.',

      example_ko: 'A: "넌 Ross에게 기회를 줄 거야?" B: "난 이 Ross 일이 좋은 생각이 아니라고 결정했어."',
      context: 'Rachel announces to Monica her decision not to pursue a romantic relationship with Ross.',
      context_ko: 'Rachel은 Monica에게 Ross와의 낭만적 관계를 추구하지 않기로 한 결정을 발표합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E24X13'
    },
    {
      phrase: 'Who cares about them? This is about us.',
      partOfSpeech: 'expression',
      meaning: 'A passionate statement prioritizing a romantic relationship over external opinions or concerns. The phrase dismisses outside judgment or pressure. It\'s used to assert that a couple\'s connection supersedes friends\' feelings or social complications.',
      meaning_ko: '외부 의견이나 우려보다 낭만적 관계를 우선하는 열정적인 진술입니다. 이 표현은 외부 판단이나 압력을 무시합니다. 그것은 부부의 연결이 친구의 감정이나 사회적 복잡성을 압도한다고 주장하는 데 사용됩니다.',
      example: 'A: "But what will your friends think?" B: "Who cares about them? This is about us."',
      example_ko: 'A: "하지만 너 친구들이 뭐라고 생각할까?" B: "그들이 뭐하는데 신경 써? 이건 우리 문제야."',
      context: 'Ross argues to Rachel that their relationship shouldn\'t be constrained by concern for friends.',
      context_ko: 'Ross는 Rachel에게 그들의 관계가 친구 걱정으로 제약받지 않아야 한다고 주장합니다.',

    },
    {
      phrase: 'I forgot, I\'m supposed to pick up a friend at the airport.',
      partOfSpeech: 'expression',
      meaning: 'A convenient excuse or honest explanation for needing to leave a situation abruptly. The phrase provides a reason for departure, whether genuine or used as a graceful exit. It\'s used to create an escape from an uncomfortable or emotionally intense moment.',
      meaning_ko: '상황을 갑자기 떠나야 할 필요성에 대한 편리한 핑계 또는 정직한 설명입니다. 이 표현은 진정한 지 아니면 우아한 퇴장으로 사용되는지 여부에 관계없이 출발의 이유를 제공합니다. 그것은 불편하거나 감정적으로 격렬한 순간에서 탈출을 만드는 데 사용됩니다.',

  var S_NUM = 1;
  var E_NUM = 24;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
    checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
