<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends S1E13 &mdash; Daily English</title>
  <link rel="stylesheet" href="../../../css/style.css">
  <style>
    .expr-card { border-radius: 12px; padding: 18px 20px; margin: 0; }
    .expr-card:hover { transform: translateX(3px); }
    .expr-phrase { font-size: 1.06rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
    .expr-meaning { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 6px; }
    .expr-example { font-size: 0.82rem; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 8px; line-height: 1.6; }
    .expr-context { font-size: 0.77rem; color: var(--muted); margin-bottom: 8px; }
    .expr-num { font-size: 0.68rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent2); margin-bottom: 7px; }
    .expr-actions { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; margin-top: 6px; }
    .btn-youtube { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 800; cursor: pointer; transition: all 0.22s; text-decoration: none; font-family: inherit; }
    .btn-youtube:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,0,0,0.4); }
    .btn-youtube.pending { background: var(--card2); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; pointer-events: none; opacity: 0.6; }
    .placeholder-slot { opacity: 0.45; border-style: dashed; }
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <button class="btn-topbar-home" onclick="goHome()" title="Home">&#127968;</button>
    <div class="topbar-logo"><span class="logo-accent">Daily</span> <span class="logo-day">English</span></div>
  </div>
  <div class="topbar-right">
    <a class="m2ea-link" href="https://www.m2eacircle.com/entertainment/index.html" target="_blank" rel="noopener">
      <span class="m2ea-icon">&#127760;</span><span class="label">m2ea Circle</span>
    </a>
  </div>
</header>
<main>
  <div class="page-wrap">
    <nav class="nav-row">
      <button class="btn-nav home" onclick="goHome()">&#127968; <span data-i18n="nav.home">Home</span></button>
      <button class="btn-nav" onclick="window.location.href='../../seasons/season1.html'">&#9664; <span data-i18n="nav.back.season" data-i18n-vars='{"n":1}'>Back to Season 1</span></button>
    </nav>
    <nav class="breadcrumb">
      <a href="../../../index.html" data-i18n="bc.home">Home</a><span class="sep">&#8250;</span>
      <a href="../../index.html">Friends</a><span class="sep">&#8250;</span>
      <a href="../../seasons/season1.html">Season 1</a><span class="sep">&#8250;</span>
      <span class="current">S1E13</span>
    </nav>
    <div class="page-header">
      <div class="page-header-thumb">
        <img src="../../images/s1e13.jpg" alt="S1E13"
          onerror="this.src='../../images/s1e13.png';this.onerror=function(){this.parentElement.innerHTML='&#127916;';};">
      </div>
      <div class="page-header-info">
        <div class="page-header-title">Friends &mdash; S1E13: The One with the Boobies</div>
        <div class="page-header-meta">Accidental nakedness causes chaos. Joey's father has a mistress.</div>
        <div class="page-header-actions">
          <button class="btn-bm" data-bm-id="episode-friends-s1e13"
            onclick="toggleBookmark('episode','episode-friends-s1e13','📋 Friends S1E13','friends/episodes/season1/s1e13.html')">
            <span data-i18n="bm.episode">&#128278; Bookmark Episode</span>
          </button>
        </div>
      </div>
    </div>
    <div class="bookmark-bar" id="bookmarkBar">
      <div class="bookmark-bar-head"><span class="bm-icon">&#128278;</span><span data-i18n="bm.bar.title">Your Bookmarks</span></div>
      <div class="bookmark-chips" id="bookmarkChips"></div>
    </div>
    <div class="section-label" data-i18n="episode.exprs.label" data-i18n-vars='{"s":1,"e":13}'>&#128172; 15 English Expressions &mdash; Season 1 Episode 13</div>
    <div class="expr-list" id="exprList"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-copy" data-i18n="footer.copy">&copy; 2025 m2ea Labs. All rights reserved.</div>
  <div><button class="footer-terms" data-i18n="footer.terms" onclick="showTermsModal()">Terms of Use</button></div>
</footer>
<div id="termsModal" style="display:none;position:fixed;inset:0;z-index:900;background:rgba(9,17,30,0.88);overflow-y:auto;"></div>
<script src="../../../js/i18n.js"></script>
<script src="../../../js/app.js"></script>
<script>
  var EP_DATA = {
    available: true,
    title: 'The One with the Boobies',
    description: 'Accidental nakedness causes chaos. Joey\'s father has a mistress.',
    expressions: [
    {
      phrase: 'You have no respect for anybody\'s privacy.',
      partOfSpeech: 'expression',
      meaning: '"Respect for privacy" means acknowledging that people have a right to personal space, time alone, and things kept from others\' view. "No respect for privacy" is a strong accusation — it says the person acts as if those boundaries simply do not exist. Saying it while wrapped in a towel, as Rachel does, makes it both righteous and extremely funny.',
      meaning_ko: '"Respect for privacy"는 사람들이 개인 공간, 혼자만의 시간, 그리고 다른 사람의 시선에서 벗어난 것들에 대한 권리가 있다는 것을 인정하는 것입니다. "No respect for privacy"는 강한 비난으로 — 상대방이 마치 그런 경계가 존재하지 않는 것처럼 행동한다는 것을 말합니다. 타월을 두른 채로 말하는 레이철의 모습이 동시에 정당하고 매우 웃깁니다.',
      example: 'A: "I just walked right in without knocking." B: "You have no respect for anybody\'s privacy. That has to stop."',
      example_ko: 'A: "그냥 노크도 없이 들어갔어." B: "다른 사람 사생활을 전혀 존중하지 않는구나. 그러면 안 되지."',
      context: 'Chandler accidentally walks in on Rachel changing. She unleashes this line as her opening argument in the confrontation that follows. The episode\'s entire comic chain reaction — the escalating series of accidental walk-ins that follows — begins here.',
      context_ko: '찬들러가 실수로 옷 갈아입는 레이철에게 들이닥치는 장면. 레이철이 이어지는 대치에서 이 대사로 첫 번째 주장을 시작합니다. 에피소드 전체의 코믹한 연쇄 반응 — 이후 이어지는 실수로 들이닥치는 사건들의 에스컬레이션 — 이 여기서 시작됩니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X1'
    }
  ]
  };

  var S_NUM = 1;
  var E_NUM = 13;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
    checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
</html>
