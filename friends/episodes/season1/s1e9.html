<script>
  var EP_DATA = {
    title: 'The One Where Underdog Gets Away',
    description: 'Everyone misses Thanksgiving dinner when they get locked out of the apartment.',
    expressions: [
    {
      phrase: 'I\'ve sort of started this whole independent thing.',
      partOfSpeech: 'expression',
      meaning: '"Started a thing" means begun a new habit, pursuit, or way of living — usually something personal and ongoing. "Sort of" softens it, suggesting it\'s still new or not fully committed to. "This whole... thing" is a casual way to describe something broad and life-changing without being too precise about it.',
      meaning_ko: '"Started a thing"은 새로운 습관, 목표, 또는 생활 방식을 시작했다는 뜻으로, 보통 개인적이고 지속적인 무언가를 말합니다. "Sort of"는 아직 새롭거나 완전히 확신하지 못한다는 것을 부드럽게 나타냅니다. "This whole... thing"은 너무 정확하지 않게 광범위하고 인생을 바꾸는 무언가를 설명하는 캐주얼한 방식입니다.',
      example: 'A: "Why are you cooking your own meals now?" B: "I\'ve sort of started this whole independent thing. Trying not to rely on my parents."',
      example_ko: 'A: "왜 요즘 직접 밥 해먹어?" B: "어떻게 보면 독립적으로 살아가는 걸 시작하는 중이야. 부모님한테 덜 의존하려고."',
      context: 'Rachel is asking Terry, her boss at Central Perk, for a $100 advance on her salary so she can fly to Vail for Thanksgiving with her family. She explains that she has started her "independent thing" — which is why she can\'t just ask her father to pay for the ticket.',
      context_ko: '레이철이 센트럴 퍼크 상사 테리에게 가족과 함께 베일에서 추수감사절을 보내기 위해 급여 $100을 미리 받을 수 있는지 부탁하는 장면. 자신이 독립적으로 사는 것을 시작했기 때문에 아버지에게 티켓 값을 달라고 할 수 없다고 설명합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X1'
    },
    {
      phrase: 'I am officially Joey Tribbiani, actor/model.',
      partOfSpeech: 'expression',
      meaning: '"Officially" means it is now formally or publicly true — no longer just hoped for or worked toward, but actually real. Adding "actor/model" as a dual title makes it funnier: the two-career label is something people put on business cards or resumes to signal they work in multiple creative fields.',
      meaning_ko: '"Officially"는 이제 공식적으로 또는 공개적으로 사실이 됐다는 뜻으로, 더 이상 바라거나 노력하는 것이 아니라 실제로 현실이 됐다는 의미입니다. "Actor/model"을 이중 직함으로 추가하는 것이 더 웃깁니다: 두 가지 커리어 레이블은 사람들이 명함이나 이력서에 적어 여러 창의적 분야에서 일한다는 것을 알리기 위해 씁니다.',
      example: 'A: "I just got my first paid acting gig." B: "So now you\'re officially an actor?" A: "Actor/model, thank you very much."',
      example_ko: 'A: "첫 유료 연기 일 잡았어." B: "그럼 이제 공식적으로 배우야?" A: "배우/모델이라고, 감사합니다."',
      context: 'Joey arrives at Central Perk wearing foundation makeup — he has just landed a modeling job for City Free Clinic health posters. He proudly announces his new dual title. Chandler\'s immediate response — "I was thinking you look more like Joey Tribbiani, man/woman" — gets the biggest laugh.',
      context_ko: '조이가 파운데이션 화장을 하고 센트럴 퍼크에 도착하는 장면. 방금 시티 무료 클리닉 건강 포스터 모델 일을 잡았습니다. 그는 자랑스럽게 새 이중 직함을 발표합니다. 찬들러의 즉각적인 반응 — "조이 트리비아니, 남자/여자처럼 보이던데" — 이 가장 큰 웃음을 끌어냅니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X2'
    },
    {
      phrase: 'Isn\'t it enough that I\'m making Thanksgiving dinner?',
      partOfSpeech: 'expression',
      meaning: 'A rhetorical question used to complain that someone is already doing more than enough. "Isn\'t it enough that..." signals frustration: "I\'m already doing this, so why am I also expected to do that?"',
      meaning_ko: '"Isn\'t it enough that...?"는 이미 충분히 하고 있는데 더 요구받을 때 불만을 드러내는 수사적 질문입니다. "이미 …하고 있잖아, 그것만으로도 충분하지 않아?"라는 뜻입니다.',
      example: 'A: "Can you also pick up the kids and drop off the dry cleaning?" B: "Isn\'t it enough that I\'m cooking dinner tonight?"',
      example_ko: 'A: "아이들도 데리고 오고 세탁소도 들러 줄 수 있어?" B: "오늘 저녁 요리하는 것만으로도 충분하지 않아?"',
      context: 'Rachel is stressed after everyone asks for a different kind of potato. When the group blames her for the lost keys, she pushes back that she already has the whole Thanksgiving dinner to handle.',
      context_ko: '레이철은 모두가 각자 다른 종류의 감자를 원하자 스트레스를 받습니다. 열쇠 문제까지 그녀 탓으로 돌아가자, 이미 추수감사절 음식 전체를 준비하고 있다며 반박합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X3'
    },
    {
      phrase: 'You\'re still boycotting all the Pilgrim holidays?',
      partOfSpeech: 'expression',
      meaning: '"Still" means something continues as it did before. "Boycotting" means refusing to take part in something as a form of protest. "Pilgrim holidays" is a playful way of referring to American holidays with Pilgrim roots, mainly Thanksgiving. Joey is asking whether Chandler still refuses to celebrate them.',
      meaning_ko: '"Still"은 전에 해 오던 일이 계속되고 있다는 뜻입니다. "Boycotting"은 항의의 뜻으로 어떤 일에 참여하지 않는 것입니다. "Pilgrim holidays"는 순례자 역사에 뿌리를 둔 미국 명절, 주로 추수감사절을 장난스럽게 부르는 말입니다. 조이는 찬들러가 아직도 이 명절들을 거부하고 있는지 묻고 있습니다.',
      example: 'A: "I\'m not going to the family reunion." B: "You\'re still boycotting all the family reunions?"',
      example_ko: 'A: "가족 모임에는 안 갈 거야." B: "아직도 가족 모임은 다 보이콧하는 거야?"',
      context: 'Joey asks Chandler whether he is still refusing to celebrate Thanksgiving. Chandler answers that he is boycotting every single one of them, showing his stubborn refusal to celebrate the holiday.',
      context_ko: '조이가 찬들러에게 아직도 추수감사절을 거부하고 있는지 묻습니다. 찬들러는 "하나도 빠짐없이 전부"라고 대답하며 명절을 기념하지 않겠다는 고집을 드러냅니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X4'
    },
    {
      phrase: 'I asked, "Got the keys?"',
      partOfSpeech: 'expression',
      meaning: 'This line is the pivot of the episode\'s central disaster. Chandler insists he said "Got the keys?" (a question) not "Got the keys." (a statement). The difference between a rising tone (question) and a flat tone (declaration) is everything — and in speech, it\'s entirely about delivery. The argument that follows shows how easy it is for a simple miscommunication to spiral.',
      meaning_ko: '이 대사는 에피소드 중심 재앙의 전환점입니다. 찬들러는 자신이 "열쇠 있어?"(질문)라고 말했지 "열쇠 있다."(진술)라고 말하지 않았다고 주장합니다. 올라가는 어조(질문)와 평평한 어조(선언)의 차이가 전부입니다 — 그리고 말에서는 전적으로 전달 방식의 문제입니다. 이어지는 논쟁은 단순한 의사소통 오류가 얼마나 쉽게 걷잡을 수 없이 커질 수 있는지를 보여줍니다.',
      example: 'A: "You said you had the tickets." B: "No, I asked, \'Got the tickets?\' — there\'s a difference."',
      example_ko: 'A: "티켓 있다고 했잖아." B: "아니, 나는 \'티켓 있어?\'라고 물었어 — 차이가 있다고."',
      context: 'The whole group has been locked out of Monica\'s apartment — in the dark, the oven on, Thanksgiving dinner burning inside. The argument about who said what about the keys becomes a full-scale bickering session. Monica eventually breaks it up: "Enough with the keys. No one say \'keys.\'"',
      context_ko: '모든 친구들이 모니카의 아파트 밖에 갇힌 상황 — 어둠 속에서, 오븐이 켜져 있고, 추수감사절 저녁이 안에서 타고 있습니다. 누가 열쇠에 대해 무엇을 말했는지에 대한 논쟁이 본격적인 싸움으로 번집니다. 모니카가 결국 중단시킵니다: "열쇠 얘기는 그만해. 아무도 \'열쇠\'라고 말하지 마."',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X5'
    },
    {
      phrase: 'This was nobody\'s first choice.',
      partOfSpeech: 'expression',
      meaning: 'Said to acknowledge that none of the people in the current situation actually wanted to be there — that everyone had other, better plans. It\'s a levelling statement: nobody can claim they wanted this more than anyone else, because everyone wanted something different. Used here both as a rebuke and as an unintentional admission.',
      meaning_ko: '현재 상황에 있는 사람 중 실제로 거기 있고 싶었던 사람이 아무도 없다는 것을 인정하기 위해 하는 말로, 모두가 다른, 더 좋은 계획이 있었다는 것을 뜻합니다. 이것은 공평한 발언입니다: 모두가 다른 것을 원했기 때문에 아무도 다른 사람보다 이것을 더 원했다고 주장할 수 없습니다. 여기서는 질책이자 의도치 않은 자백으로 쓰입니다.',
      example: 'A: "Nobody looks happy about this." B: "This was nobody\'s first choice. But we\'re here, so let\'s make it work."',
      example_ko: 'A: "아무도 이걸 좋아 보이지 않네." B: "아무도 처음부터 이걸 원하지 않았지. 근데 여기 있으니, 잘 해보자."',
      context: 'Rachel arrives back from the roof, furious that she has missed her flight to Vail because of the Underdog balloon. Monica fires back with this line — intended to make Rachel feel less singled out, but accidentally admitting that hosting this dinner was also not what Monica really wanted.',
      context_ko: '레이철이 언더독 풍선 때문에 베일행 비행기를 놓쳐서 화가 난 채로 옥상에서 돌아오는 장면. 모니카가 이 말로 반격합니다 — 레이철만 힘든 게 아니라고 느끼게 하려는 의도였지만, 의도치 않게 이 저녁을 주최하는 것도 모니카가 진정으로 원했던 것이 아니었음을 인정하게 됩니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X6'
    },
    {
      phrase: 'What is it with you and this holiday?',
      partOfSpeech: 'expression',
      meaning: '"What is it with you and...?" is a casual way to ask why someone feels so strongly about, or is so attached to, something. It is often said with a teasing tone when someone\'s obsession seems puzzling. "This holiday" here refers to Thanksgiving.',
      meaning_ko: '"What is it with you and...?"는 누군가가 특정한 것에 왜 그렇게 집착하거나 강하게 반응하는지 묻는 캐주얼한 표현입니다. 상대의 집착이 조금 이해가 안 될 때 장난스럽게 씁니다. 여기서 "this holiday"는 추수감사절을 가리킵니다.',
      example: 'A: "I\'ve already planned three Halloween parties this year." B: "What is it with you and Halloween?"',
      example_ko: 'A: "올해 할로윈 파티를 벌써 세 개나 잡았어." B: "넌 할로윈에 대체 왜 그렇게 집착하는 거야?"',
      context: 'Chandler is served a Thanksgiving feast of tomato soup, grilled-cheese fixings, and a family-size bag of Funyuns, and a friend is baffled by the choice of holiday meal.',
      context_ko: '찬들러는 토마토 수프, 그릴드 치즈 재료, 패밀리 사이즈 펀초스로 이루어진 추수감사절 식사를 받고, 친구 한 명이 이 명절 음식에 어리둥절해합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X7'
    },
    {
      phrase: 'I\'d like to propose a toast.',
      partOfSpeech: 'expression',
      meaning: 'To "propose a toast" means to suggest that everyone raise their glasses and drink together in honour of someone or something. It\'s a traditional ritual at celebrations, dinners, and gatherings. The phrase signals that someone is about to say something meaningful — a brief speech of appreciation, honour, or good wishes.',
      meaning_ko: '"Propose a toast"는 누군가나 무언가를 기리기 위해 모두가 잔을 들고 함께 마시자고 제안하는 것을 의미합니다. 기념행사, 저녁식사, 모임에서의 전통적인 의식입니다. 이 표현은 누군가가 의미 있는 말 — 감사, 경의, 또는 좋은 바람의 짧은 연설 — 을 하려 한다는 신호입니다.',
      example: 'A: "Before we eat, I\'d like to propose a toast to the birthday girl." B: "Hear, hear."',
      example_ko: 'A: "먹기 전에, 오늘의 주인공을 위해 건배 제안을 하고 싶어." B: "좋아, 좋아."',
      context: 'Ross proposes a toast at the burnt, improvised Thanksgiving dinner. What follows is one of the most genuinely warm moments of the season: he tells everyone that despite the disasters that brought them all together, he is truly thankful their Thanksgivings sucked — because it meant they all ended up in the same place.',
      context_ko: '로스가 탄 즉흥 추수감사절 저녁식사에서 건배 제안을 하는 장면. 이어지는 것이 시즌에서 가장 진심으로 따뜻한 순간 중 하나입니다: 그는 모두를 여기 모이게 한 재난들에도 불구하고, 모두의 추수감사절이 엉망이었던 것에 진심으로 감사한다고 말합니다 — 그 덕분에 다들 같은 곳에 있게 됐으니까요.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X8'
    },
    {
      phrase: 'I hear Lyme disease is open.',
      partOfSpeech: 'expression',
      meaning: '"I hear..." means you got the information secondhand, so you are not fully certain it is true. "Is open" means a role or slot is still available. Joey is saying the Lyme disease poster role has not been taken yet.',
      meaning_ko: '"I hear..."는 다른 사람에게 들은 정보라서 확실하지 않다는 뜻입니다. "is open"은 자리나 역할이 아직 비어 있다는 뜻입니다. 조이는 라임병 포스터 모델 자리가 아직 남아 있다고 말하고 있습니다.',
      example: 'A: "Are there still spots left for the volunteer team?" B: "I hear the registration desk is open. You should go sign up."',
      example_ko: 'A: "자원봉사팀에 아직 자리 있어?" B: "안내 데스크 쪽 자리가 비었다고 들었어. 가서 신청해 봐."',
      context: 'Joey talks about which City Free Clinic poster he will model for. He hears the Lyme disease poster is still open, and Chandler wishes him luck.',

    {

      partOfSpeech: 'expression',
      meaning: '"Ugly Naked Guy" is the nickname of a neighbor whose apartment Phoebe can see across the courtyard. "Guy\'s" is a contraction of "Guy is," used to describe something happening right now.',
      meaning_ko: '"Ugly Naked Guy"는 안뜰 건너편 아파트에 사는 이웃의 별명입니다. "Guy\'s"는 "Guy is"의 줄임말로, 지금 진행 중인 일을 말할 때 씁니다.',

    {

      meaning_ko: '"You\'re just happy..."는 상대에게 지금 상황에 만족하라고 장난스럽게 말하는 표현입니다. 로스는 태아가 발달 초기에 가졌던 아가미가 없어진 것을 다행으로 여기라며, 진화를 가볍게 빗대어 농담하고 있습니다.',
      example: 'A: "I have to wake up at five tomorrow." B: "You\'re just happy you have the day off today."',
      example_ko: 'A: "내일 새벽 5시에 일어나야 해." B: "넌 오늘 쉬는 날이라 좋겠다."',
      context: 'Ross, the expectant father of Carol\'s baby, talks to the fetus and tells it about his paleontology major. He jokes that the baby probably understands none of it.',
      context_ko: '캐롤의 아기를 기다리고 있는 로스는 태아에게 자신이 고생물학을 전공한 이야기를 들려줍니다. 아기는 그 이야기를 하나도 이해하지 못할 거라고 농담합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X11'
    },
    {
      phrase: 'That tone won\'t make me go any faster.',
      partOfSpeech: 'expression',
      meaning: 'Said when someone is pressuring you by being impatient, sharp, or bossy — and you\'re calmly pointing out that their attitude is counterproductive. "Tone" refers to the quality or manner of their voice. The phrase is a polite-but-firm pushback: I hear your urgency, but it won\'t change how fast I can move.',
      meaning_ko: '누군가가 참을성 없거나 날카롭거나 권위적인 태도로 압박하고 있을 때, 그들의 태도가 역효과를 낸다는 것을 차분하게 지적하는 말입니다. "Tone"은 그들 목소리의 질이나 방식을 말합니다. 이 표현은 정중하지만 단호한 반박입니다: 당신의 다급함은 알겠지만, 내가 얼마나 빨리 움직일 수 있는지는 달라지지 않아요.',
      example: 'A: "Can you PLEASE hurry up?!" B: "Hey. That tone won\'t make me go any faster."',
      example_ko: 'A: "좀 빨리 해줄 수 없어?!" B: "야. 그런 식으로 말해봤자 내가 더 빨리 가진 않아."',
      context: 'Everyone is panicking outside the locked apartment, and Monica snaps at Joey to go get a spare key from across the hall. Joey\'s calm, dignified response — "That tone won\'t make me go any faster" — followed by Monica\'s single-word "Joey" that apparently does the trick, is a wonderfully timed exchange.',
      context_ko: '모두가 잠긴 아파트 밖에서 당황하고 있고, 모니카가 복도 건너편에서 예비 열쇠를 가져오라고 조이에게 버럭하는 장면. 조이의 침착하고 점잖은 반응 — "그런 식으로 말해봤자 내가 더 빨리 가진 않아" — 에 이어 모니카의 한 마디 "조이"가 효과를 발휘하는, 타이밍이 훌륭한 교환입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X12'
    },
    {
      phrase: 'I\'m going to the roof. Who\'s with me?',
      partOfSpeech: 'expression',
      meaning: '"Who\'s with me?" is a casual invitation asking who will join you in doing something. Here, going to "the roof" means climbing up to see the escaped Underdog balloon, so it is a spontaneous call to action.',
      meaning_ko: '"Who\'s with me?"는 "같이 갈 사람?"이라는 뜻으로, 무언가를 함께하자고 가볍게 권할 때 씁니다. 여기서는 도망간 언더독 풍선을 보러 옥상에 올라가자는 즉흥적인 제안입니다.',
      example: 'A: "The fireworks start in five minutes!" B: "I\'m going to the roof. Who\'s with me?"',
      example_ko: 'A: "불꽃놀이 5분 뒤에 시작해!" B: "나 옥상 간다. 같이 갈 사람?"',
      context: 'News spreads that the Underdog balloon has escaped and is flying over Washington Square Park. Someone decides to head up to the roof to watch it and invites the others along.',
      context_ko: '언더독 풍선이 탈출해 워싱턴 스퀘어 공원 위를 날고 있다는 소식이 퍼집니다. 누군가 그것을 보러 옥상에 가자며 다른 사람들을 초대합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E9X13'
    },
    {
      phrase: 'Now this feels like Thanksgiving.',
      partOfSpeech: 'expression',
      meaning: 'Said at the moment when a chaotic, argumentative gathering suddenly feels authentic — because the bickering and tension actually mirror a real family holiday. The irony is sharp: real Thanksgiving isn\'t perfect and peaceful; it\'s loud and messy. The moment everyone starts yelling is when it finally "feels right."',
      meaning_ko: '혼란스럽고 논쟁적인 모임이 갑자기 진짜처럼 느껴지는 순간에 하는 말입니다 — 말다툼과 긴장감이 실제 가족 명절을 반영하기 때문입니다. 아이러니가 날카롭습니다: 진짜 추수감사절은 완벽하고 평화롭지 않습니다. 시끄럽고 지저분합니다. 모두가 소리치기 시작하는 순간이 비로소 "제대로 된 느낌"이 나는 것입니다.',
      example: 'A: "Everyone\'s arguing again." B: "Good. Now this feels like a real family dinner."',

      context: 'The group erupts into a full argument outside the locked door — about keys, potatoes, plans, blame. Chandler, the one person who deliberately had no expectations for the day, steps back and observes with wry satisfaction: "Now this feels like Thanksgiving." He\'s the only one not surprised.',
      context_ko: '친구들이 잠긴 문 밖에서 본격적인 말다툼으로 폭발하는 장면 — 열쇠, 감자, 계획, 책임에 대해. 의도적으로 이날에 아무런 기대도 하지 않았던 찬들러가 물러서서 건조한 만족감으로 관찰합니다: "이제 추수감사절 같은 느낌이 나네." 그만이 놀라지 않은 유일한 사람입니다.',

      meaning_ko: '"Lunar"는 태음력을 따르는 사람을 뜻합니다. 피비의 가족은 그 사람의 달력에 맞춰 추수감사절을 한 달 뒤인 12월에 지냅니다. "Because he\'s lunar"는 장난스러운 설명입니다.',

      context: 'Phoebe explains that she will spend the holiday with her grandmother and her grandmother\'s boyfriend. Their Thanksgiving falls in December because of his lunar calendar, and a friend asks whether he can come along.',
      context_ko: '피비는 할머니와 할머니의 남자친구와 함께 명절을 보낼 예정이라고 설명합니다. 남자친구가 음력을 따르기 때문에 추수감사절은 12월에 치르며, 친구 한 명이 같이 가도 되는지 묻습니다.',

  var S_NUM = 1;
  var E_NUM = 9;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
</html>
