      partOfSpeech: 'expression',
      meaning: 'A statement expressing strong disbelief or shock at someone\'s statement or opinion. The phrase emphasizes the speaker\'s surprise that someone would voice such an idea. It shows disagreement or disapproval of what was said, often used when the comment is unexpected or offensive.',
      meaning_ko: '누군가의 진술이나 의견에 대한 강한 의심이나 충격을 표현하는 진술입니다. 이 표현은 화자가 누군가가 그러한 아이디어를 표명할 것에 대한 놀라움을 강조합니다. 무엇이 말해졌는지에 대한 불동의나 불만을 보여주며, 종종 의견이 예상 밖이거나 모욕적일 때 사용됩니다.',
      example: 'A: "I think vanilla ice cream is better than chocolate." B: "I can\'t believe you would actually say that!"',

    {
      phrase: 'There\'s some creep out there with a telescope.',

      meaning: 'A statement identifying someone behaving inappropriately or disturbingly, typically someone invading privacy. The word "creep" is used to describe an unpleasant or suspicious person. The phrase conveys alarm and concern about a dangerous or uncomfortable situation.',
      meaning_ko: '부적절하거나 불편한 행동을 하는 누군가, 일반적으로 개인정보를 침해하는 누군가를 식별하는 진술입니다. "Creep"이라는 단어는 불쾌하거나 의심스러운 사람을 설명하는 데 사용됩니다. 이 표현은 위험하거나 불편한 상황에 대한 경보와 우려를 전달합니다.',

      context: 'Monica and Rachel discover someone using a telescope to look into their apartment from across the street, violating their privacy.',
      context_ko: 'Monica와 Rachel은 누군가가 길 건너에서 망원경을 사용하여 그들의 아파트를 보고 있다는 것을 발견하여 개인정보를 침해합니다.',

      meaning: 'A strong expression of disgust or disapproval toward something offensive or morally wrong. In casual American English, "sick" can mean both physically ill and deeply wrong or immoral. The phrase conveys strong negative emotion about inappropriate behavior.',
      meaning_ko: '무언가 불쾌하거나 도덕적으로 잘못된 것에 대한 혐오 또는 불만의 강한 표현입니다. 캐주얼한 미국 영어에서 "sick"은 신체적으로 아프고 깊게 잘못되거나 부도덕한 것을 의미할 수 있습니다. 이 표현은 부적절한 행동에 대한 강한 부정적 감정을 전달합니다.',

      context: 'Rachel and the group express outrage upon discovering that someone is spying on them with a telescope from across the street.',
      context_ko: 'Rachel과 그룹은 누군가가 길 건너에서 망원경으로 자신들을 염탐하고 있다는 것을 발견하고 분노를 표현합니다.',

    {

      meaning: 'A personal statement describing the emotional impact of having one\'s privacy, boundaries, or dignity compromised. It\'s a powerful way to express how someone\'s personal space or rights have been invaded. The phrase goes beyond physical violation to include emotional and psychological harm.',
      meaning_ko: '누군가의 개인정보, 경계, 또는 존엄성이 손상되었을 때 감정적 영향을 설명하는 개인적 진술입니다. 그것은 누군가의 개인 공간이나 권리가 어떻게 침해되었는지를 표현하는 강력한 방법입니다. 이 표현은 신체적 침해를 넘어 정서적 및 심리적 해를 포함합니다.',

      example_ko: 'A: "누군가가 내 이메일 계정을 해킹하고 내 개인 메시지를 읽었어." B: "정말 미안해. 그것은 마치 침해당한 기분이야."',
      context: 'Monica, Phoebe, and Rachel express their distress about someone watching them without consent, affecting their sense of safety and privacy.',
      context_ko: 'Monica, Phoebe, Rachel은 누군가가 동의 없이 자신들을 보고 있다는 것에 대해 고통을 표현하며, 그들의 안전과 개인정보 감각에 영향을 미칩니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E20X4'

      phrase: 'How can people do that?',

      meaning_ko: '인간 행동에 대한 도덕적 분노나 당혹감을 표현하는 수사적 질문입니다. 화자는 진정으로 설명을 요청하는 것이 아니라 오히려 자신의 불만을 강조하고 있습니다. 그것은 행동이 너무 잘못되어 이해를 벗어난다는 것을 말하는 방법입니다.',

      context: 'The friends question the moral compass of the person who is spying on them with a telescope, unable to comprehend such invasive behavior.',
      context_ko: '친구들은 망원경으로 그들을 염탐하는 사람의 도덕적 나침반을 의문시하며, 그러한 침해적 행동을 이해할 수 없습니다.',

    },
    {
      phrase: 'It was actually really great.',
      partOfSpeech: 'expression',
      meaning: 'A sincere expression of satisfaction or enjoyment about a past experience. The addition of "actually" suggests the speaker was pleasantly surprised or it exceeded expectations. It\'s a positive assessment that goes beyond merely "good" to convey genuine delight.',
      meaning_ko: '지난 경험에 대한 만족이나 즐거움에 대한 진정한 표현입니다. "Actually"의 추가는 화자가 기분 좋게 놀라거나 기대를 초과했음을 시사합니다. 그것은 단순히 "좋다"를 넘어 진정한 기쁨을 전달하는 긍정적 평가입니다.',
      example: 'A: "How was your date?" B: "It was actually really great. We had so much fun together."',
      example_ko: 'A: "데이트는 어땠어?" B: "정말 정말 좋았어. 우리는 함께 정말 재미있게 놀았어."',
      context: 'Rachel describes her date with Barry at the Russian Tea Room, indicating it went better than she initially expected.',
      context_ko: 'Rachel은 Russian Tea Room에서의 Barry와의 데이트를 설명하며, 그것이 초기 기대보다 더 잘 진행되었음을 나타냅니다.',

      meaning: 'A humorous observation about something unfortunate happening to birds or bird-related situations. The phrase uses irony or dark humor to comment on an awkward situation. It\'s often used as a lighthearted deflection from a serious topic.',
      meaning_ko: '새들이나 새와 관련된 상황에 뭔가 불운한 일이 일어나는 것에 대한 유머러스한 관찰입니다. 이 표현은 아이러니 또는 어두운 유머를 사용하여 어색한 상황을 논평합니다. 종종 진지한 주제에서 가벼운 방향 전환으로 사용됩니다.',
      example: 'A: "I accidentally spilled soup on the pigeons in the park." B: "Not a good day for birds."',
      example_ko: 'A: "난 실수로 공원의 비둘기들에게 수프를 흘렸어." B: "새들에게는 안 좋은 날이야."',
      context: 'The group makes a dark humor joke about Rachel\'s description of the chicken dish where butter squirts out when poked, comparing it to a bird-related misfortune.',
      context_ko: '그룹은 Rachel이 건드렸을 때 버터가 튀어나오는 닭 요리의 설명에 대해 검은 유머 농담을 하며, 이를 새 관련 불운과 비교합니다.',

    },
    {
      phrase: 'He wasn\'t, like, Orthodontist Guy, you know?',
      partOfSpeech: 'expression',
      meaning: 'A comment distinguishing between two different versions of a person — their professional identity versus their personal self. The phrase suggests that Barry was more like his genuine self rather than just playing the role of an orthodontist. It\'s used to explain that someone showed a different, more appealing side.',
      meaning_ko: '두 가지 다른 버전의 사람을 구분하는 의견입니다. 즉, 직업적 정체성 대 개인적 자아입니다. 이 표현은 Barry가 단순히 치과의사 역할을 하기보다는 자신의 진정한 모습 같았다는 것을 시사합니다. 누군가가 다르고 더 매력적인 면을 보였다는 것을 설명하는 데 사용됩니다.',
      meaning_ko: '두 가지 다른 버전의 사람을 구분하는 의견입니다. 즉, 직업적 정체성 대 개인적 자아입니다. 이 표현은 Barry가 단순히 교정치과의 역할을 하기보다는 자신의 진정한 모습 같았다는 것을 시사합니다.',
      example: 'A: "Why do you like him now?" B: "He wasn\'t like, Businessman Guy. He was just himself, you know?"',
      example_ko: 'A: "넌 왜 지금 그를 좋아해?" B: "그는 사업가 타입이 아니었어. 그냥 자신이었어, 알지?"',
      context: 'Rachel tries to explain to the group that Barry seemed different — more like a real person and less like just his professional identity.',
      context_ko: 'Rachel은 그룹에 Barry가 다르게 보였다고 설명하려고 합니다. 즉, 더 실제 사람 같았고 단순한 직업적 정체성보다 덜 그랬습니다.',

    },
    {
      phrase: 'I mean, we had fun.',
      partOfSpeech: 'expression',
      meaning: 'A simple statement emphasizing that an experience was enjoyable. The phrase is often used to justify or defend an action by focusing on the positive aspects. It\'s a casual way of saying that regardless of other considerations, the event was pleasurable.',
      meaning_ko: '경험이 즐거웠다는 것을 강조하는 간단한 진술입니다. 이 표현은 종종 긍정적 측면에 초점을 맞춤으로써 행동을 정당화하거나 방어하는 데 사용됩니다. 그것은 다른 고려 사항에도 불구하고 그 사건이 즐거웠다는 것을 말하는 캐주얼한 방법입니다.',
      example: 'A: "You probably shouldn\'t have gone out with him again." B: "Yeah, but I mean, we had fun. What\'s wrong with that?"',
      example_ko: 'A: "넌 그와 다시 나가지 말았어야 해." B: "응, 하지만 우리는 재미있었어. 뭐가 문제야?"',
      context: 'Rachel defends her decision to spend time with Barry by pointing out that they genuinely enjoyed themselves, despite the complicated situation.',
      context_ko: 'Rachel은 복잡한 상황에도 불구하고 그들이 진정으로 즐겼다는 것을 지적함으로써 Barry와 시간을 보내기로 한 결정을 방어합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E20X9'
    },

      phrase: 'Is there anything wrong with that?',

      meaning_ko: '누군가의 비판이나 불만에 도전하는 방어적 질문입니다. 화자는 다른 사람에게 그들의 반대를 정당화하도록 요청하고 있습니다. 누군가가 부당하게 판단받는다고 느끼고 자신에게 향해진 비판을 이해하거나 논증하고 싶을 때 사용됩니다.',

      example_ko: 'A: "난 넌 다시 그를 만나지 말아야 한다고 생각해." B: "누군가와 재미있게 지내는 게 뭐가 문제야?"',

    },
    {
      phrase: 'Will you grow up?',
      partOfSpeech: 'question',

  var S_NUM = 1;
  var E_NUM = 20;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
    checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
