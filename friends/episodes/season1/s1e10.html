<script>
  var EP_DATA = {
    title: 'The One with the Monkey',
    description: 'Ross gets a pet monkey named Marcel. Everyone brings a date to a New Year\'s party.',
    expressions: [
    {
      phrase: 'It\'s been kind of quiet since Carol left.',
      partOfSpeech: 'expression',      speaker: 'Ross',

      meaning: '"Kind of quiet" is a gentle, understated way of describing loneliness or emptiness after someone leaves. "Since [person] left" establishes the cause. Together, the phrase communicates deep sadness without stating it directly — the quietness stands in for heartbreak, and using "kind of" makes it even more heartbreakingly casual.',
      meaning_ko: '"Kind of quiet"는 누군가가 떠난 후의 외로움이나 허전함을 부드럽고 절제된 방식으로 표현하는 말입니다. "Since [사람] left"는 그 원인을 설명합니다. 두 표현이 합쳐져 슬픔을 직접 말하지 않으면서도 깊은 슬픔을 전달합니다 — 조용함이 상실감을 대신하고, "kind of"를 쓰면 더욱 가슴 아프게 담담해집니다.',
      example: 'A: "How have you been since you moved to the new place?" B: "Honestly, it\'s been kind of quiet. I miss having people around."',
      example_ko: 'A: "새 집으로 이사한 후 어때?" B: "솔직히, 좀 조용해졌어. 주변에 사람들이 있던 게 그리워."',
      context: 'When the friends ask why Ross got a monkey, he explains with this quietly devastating line. He doesn\'t say he\'s lonely or heartbroken. He just says it\'s "been kind of quiet" — and somehow that makes it sadder. Getting a monkey is the most Ross possible response to a divorce.',
      context_ko: '친구들이 왜 원숭이를 데려왔냐고 묻자, 로스가 이 조용하고 처절한 대사로 설명하는 장면. 그는 외롭다거나 상심했다고 말하지 않습니다. 그냥 "좀 조용해졌어"라고 할 뿐 — 그게 더 슬프게 느껴집니다. 원숭이를 데려오는 건 이혼에 대한 가장 로스다운 반응입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X1'
    },
    {
      phrase: 'Pathet. It\'s Sanskrit for \'really cool way to live.\'',
      partOfSpeech: 'expression',
      speaker: 'Ross',
      meaning: 'A verbal recovery — an invented word to cover what was almost said. When Ross catches himself mid-insult (he was about to say \"pathetic\"), he immediately claims \"pathet\" is a real Sanskrit word meaning the opposite. It shows how English speakers construct improvised saves when they accidentally reveal an embarrassing opinion.',
      meaning_ko: '하마터면 했을 말을 덮기 위해 즉석에서 만들어낸 단어로 수습하는 표현입니다. 로스가 \"pathetic(한심한)\"을 말하려다 자신을 잡고, 즉시 \"pathet\"이 반대 의미를 가진 진짜 산스크리트어라고 주장합니다. 영어 화자들이 실수로 당혹스러운 의견을 드러냈을 때 즉흥적인 수습을 구성하는 방법을 보여줍니다.',
      example: 'A: \"You were going to say \"embarrassing,\" weren\'t you.\" B: \"No, no — pathet. It\'s Sanskrit for \'really brave decision.\'\"\"',
      example_ko: 'A: \"창피하다고 하려던 거지.\" B: \"아니, 아니 — pathet이라고. \'정말 용감한 결정\'이라는 뜻의 산스크리트어야.\"',
      context: 'Ross starts to say that adults with roommates are \"pathetic\" — then realizes Chandler and Joey (both adults with roommates) are sitting right in front of him. His instant recovery inventing a Sanskrit etymology is one of the episode\'s best jokes and a textbook example of improvised verbal damage control.',
      context_ko: '로스가 룸메이트가 있는 어른들이 \"한심하다\"고 말하려다 — 찬들러와 조이(둘 다 룸메이트가 있는 어른들)가 바로 앞에 앉아 있다는 것을 깨닫는 장면. 산스크리트어 어원을 지어내는 즉각적인 수습이 에피소드 최고의 농담 중 하나이며 즉흥적인 언어적 피해 통제의 교과서적 예입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X2'
    },
    {
      phrase: 'Might want to open with the snowman.',
      partOfSpeech: 'expression',      speaker: 'Chandler',

      meaning: '"Open with" something means to start a performance, speech, or presentation with that particular item — to use it as your first piece. Chandler\'s advice to Phoebe is tactful: she has 12 dark songs about her mother\'s suicide and one cheerful snowman song. He gently suggests leading with the least depressing option.',
      meaning_ko: '무언가로 "open"한다는 것은 공연, 연설, 또는 발표를 그 특정 항목으로 시작한다는 뜻입니다. 피비에 대한 찬들러의 조언은 배려심이 있습니다: 그녀에게 어머니의 자살에 관한 어두운 노래 12곡과 눈사람에 관한 유쾌한 노래 1곡이 있습니다. 그는 가장 덜 우울한 것으로 시작하라고 부드럽게 제안합니다.',
      example: 'A: "I have a presentation on budget cuts and then one on the company picnic." B: "Might want to open with the picnic."',
      example_ko: 'A: "예산 삭감에 대한 발표 하나하고 회사 야유회에 대한 발표 하나 있어." B: "야유회로 시작하는 게 나을 것 같은데."',
      context: 'Phoebe announces she is debuting all-new material that evening: 12 songs about her mother\'s suicide and one about a snowman. Chandler\'s dry, deadpan suggestion to open with the snowman is perfectly timed and says everything without saying anything.',
      context_ko: '피비가 그날 저녁 완전히 새로운 곡들을 선보이겠다고 발표하는 장면: 어머니의 자살에 관한 노래 12곡과 눈사람에 관한 노래 1곡. 찬들러의 건조하고 무표정한 눈사람으로 시작하라는 제안이 타이밍이 완벽하고 아무 말도 하지 않으면서 모든 것을 말합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X3'
    },
    {
      phrase: 'It\'s just such a slap in the face.',
      partOfSpeech: 'expression',      speaker: 'Joey',

      meaning: 'A "slap in the face" is an idiom meaning a deeply insulting or humiliating experience — something that feels like a direct personal affront or disrespect. It doesn\'t involve actual physical contact; it describes the emotional sting of being undervalued or dismissed.',
      meaning_ko: '"Slap in the face"는 깊이 모욕적이거나 굴욕적인 경험을 의미하는 관용어입니다 — 직접적인 개인적 모욕이나 무시처럼 느껴지는 것입니다. 실제 신체 접촉을 포함하지 않고, 가치를 인정받지 못하거나 무시당하는 감정적 충격을 묘사합니다.',
      example: 'A: "They gave the promotion to someone who just started." B: "After five years? That\'s just such a slap in the face."',
      example_ko: 'A: "방금 입사한 사람에게 승진을 줬어." B: "5년 일하고 나서? 완전 뺨 맞은 기분이겠다."',
      context: 'Joey applied for the department store Santa job he had last year, but was passed over — because a new guy is "sleeping with the store manager." Now Joey has to play one of Santa\'s helpers. Being demoted from Santa to elf is the humiliation that drives this line.',
      context_ko: '조이가 작년에 맡았던 백화점 산타 자리에 지원했지만 탈락하는 장면 — 새로운 사람이 "매장 매니저와 자고 있기 때문에"입니다. 이제 조이는 산타의 조수 중 하나가 됩니다. 산타에서 엘프로 강등되는 것이 이 대사의 배경이 되는 굴욕입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X4'
    },
    {
      phrase: 'No dates. We make a pact.',
      partOfSpeech: 'expression',      speaker: 'Chandler',

      meaning: 'A "pact" is a formal agreement between people — a commitment that everyone promises to honour. "We make a pact" elevates a simple group decision into something more binding and ceremonial. Here, Chandler uses it to propose a group agreement to spend New Year\'s together without dates, to avoid the pressure of the holiday.',
      meaning_ko: '"Pact"는 사람들 사이의 공식적인 합의, 즉 모든 사람이 지키겠다고 약속하는 다짐입니다. "We make a pact"는 단순한 그룹 결정을 더 구속력 있고 의식적인 것으로 격상시킵니다. 여기서 찬들러는 명절의 압박을 피하기 위해 데이트 없이 함께 새해를 보내자는 그룹 합의를 제안하기 위해 이것을 씁니다.',
      example: 'A: "Every year we say we\'re gonna exercise more." B: "This year we make a pact. No excuses."',
      example_ko: 'A: "매년 운동을 더 하겠다고 말하잖아." B: "올해는 약속 해. 변명 없이."',
      context: 'Chandler is fed up with the pressure of New Year\'s — the "desperate scramble to find anything with lips" — and proposes the group spend it together with no dates. The pact immediately and spectacularly falls apart as one by one every member admits they have already invited someone.',
      context_ko: '찬들러가 새해의 압박 — "뭔가 입술이 있는 것이면 뭐든 찾으려는 필사적인 몸부림" — 에 진절머리가 나서 친구들과 데이트 없이 함께 보내자고 제안하는 장면. 약속은 즉시 그리고 장렬하게 무너집니다. 한 명 한 명 이미 누군가를 초대했다고 인정하면서요.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X5'
    },
    {
      phrase: 'We had our first fight this morning.',
      partOfSpeech: 'expression',      speaker: 'Ross',

      meaning: '"First fight" in a relationship marks the moment when initial harmony breaks down — the first real conflict between two people (or in this case, a person and a monkey). "We had our first fight" treats it as a significant milestone, which is funny here because Ross is talking about a pet.',
      meaning_ko: '관계에서 "first fight"는 초기의 화합이 무너지는 순간을 나타냅니다 — 두 사람(또는 이 경우, 사람과 원숭이) 사이의 첫 번째 진짜 갈등. "We had our first fight"는 이것을 중요한 이정표로 취급하는데, 로스가 애완동물에 대해 이야기하고 있기 때문에 웃깁니다.',
      example: 'A: "How are things with your new roommate?" B: "We had our first fight this morning. About dishes, of all things."',
      example_ko: 'A: "새 룸메이트랑 어때?" B: "오늘 아침에 처음 싸웠어. 하필 설거지 때문에."',
      context: 'Ross confides in Monica about his troubled relationship with Marcel. "I think it has to do with my working late. I said some things I didn\'t mean. He threw some feces." The deadpan delivery of "he threw some feces" as a natural consequence of a fight is perfectly timed.',
      context_ko: '로스가 마르셀과의 힘든 관계에 대해 모니카에게 털어놓는 장면. "내 야근 때문인 것 같아. 뜻하지 않은 말을 했어. 그가 변을 던졌어." "그가 변을 던졌어"를 싸움의 자연스러운 결과로 무표정하게 전달하는 것이 타이밍이 완벽합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X6'
    },
    {
      phrase: 'I wanted this to work so much.',
      partOfSpeech: 'expression',
      speaker: 'Ross',
      meaning: 'A simple, vulnerable way to express disappointment about something you hoped would succeed. "So much" intensifies the wish, and the past tense "wanted" suggests the hope is fading or already gone. It is often used when a relationship, plan, or project has not turned out as hoped.',
      meaning_ko: '잘되기를 간절히 바랐던 일에 대한 실망을 표현하는 간단하고 솔직한 말입니다. "so much"는 바람의 강도를 높이고, 과거형 "wanted"는 그 희망이 사라지고 있거나 이미 사라졌음을 암시합니다. 관계나 계획이 기대만큼 되지 않았을 때 쓰는 말입니다.',
      example: 'A: "I know the trip didn\'t go well." B: "I wanted this to work so much. I planned everything for months."',
      example_ko: 'A: "여행이 잘 안 됐던 거 알아." B: "정말 잘되기를 바랐어. 몇 달 동안 모든 걸 준비했는데."',
      context: 'Ross is struggling with his relationship with Marcel. He still does all the daily care, changing diapers and picking fleas, but the bond is not there. Saying "I wanted this to work so much" shows how much he hoped it would work out, even though the situation is absurd.',
      context_ko: '로스가 마르셀과의 관계가 힘든 상황을 털어놓는 장면입니다. 기저귀를 갈고 벼룩을 잡아주는 등 정성을 다하지만 유대감은 생기지 않습니다. "I wanted this to work so much"라는 말은 상황이 우스꽝스러워도 그가 얼마나 잘되기를 바랐는지를 보여줍니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X7'
    },
    {
      phrase: 'He keeps shutting me out.',
      partOfSpeech: 'expression',      speaker: 'Ross',

      meaning: 'To "shut someone out" means to deliberately exclude them emotionally — to keep your distance, be cold, or refuse to connect. "Keeps" emphasizes it\'s a repeated pattern, not a one-time thing. The phrase is usually used about human relationships, which is what makes it funny here since Ross is talking about a monkey.',
      meaning_ko: '누군가를 "shut out"한다는 것은 의도적으로 감정적으로 배제하다는 뜻입니다 — 거리를 두거나, 냉담하거나, 연결을 거부하는 것입니다. "Keeps"는 그것이 일회성이 아닌 반복되는 패턴임을 강조합니다. 이 표현은 보통 인간 관계에서 쓰이는데, 로스가 원숭이에 대해 이야기하고 있기 때문에 웃깁니다.',
      example: 'A: "Have you talked to him lately?" B: "No. He keeps shutting me out. Won\'t return my calls."',
      example_ko: 'A: "요즘 그 사람이랑 얘기했어?" B: "아니. 계속 나를 외면해. 전화도 안 받아."',
      context: 'Ross is genuinely concerned — and genuinely hurt — that Marcel has been distant with him but apparently bonded with Monica during a visit. Ross describes it with the full vocabulary of a human emotional relationship: Marcel is "shutting him out," walking around "dragging his hands." It\'s Ross at his most endearingly eccentric.',
      context_ko: '마르셀이 자신에게는 거리를 두면서 모니카 방문 중에는 친밀하게 지냈다는 것을 알고 로스가 진심으로 걱정하고 진심으로 상처받는 장면. 로스는 이것을 인간 감정 관계의 모든 어휘로 묘사합니다: 마르셀이 자신을 "외면하고" 있고, "손을 끌며" 돌아다니고 있다고. 가장 사랑스럽게 기이한 로스의 모습입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X8'
    },
    {
      phrase: 'That thing is not coming in here.',
      partOfSpeech: 'expression',
      speaker: 'Monica',
      meaning: 'A firm, blunt refusal to let something in. "That thing" is a dismissive way to refer to something unwelcome, here a pet monkey. "Is not coming in here" uses a strong present tense to set a clear boundary. It is often said with irritation and a touch of humor when someone brings an unwelcome guest into your home.',
      meaning_ko: '무언가가 들어오는 것을 단호하고 직설적으로 막는 표현입니다. "That thing"은 원치 않는 것을 무시하듯 부르는 말로, 여기서는 애완 원숭이를 가리킵니다. "is not coming in here"는 강한 현재형으로 분명한 선을 긋습니다. 원치 않는 손님을 집에 데려온 사람에게 짜증과 유머가 섞여 자주 쓰입니다.',
      example: 'A: "Can Max\'s dog come in for a minute?" B: "That dog is not coming in here. He chewed up my couch last time."',
      example_ko: 'A: "맥스 개 잠깐만 들어와도 돼?" B: "그 개는 여기 못 들어와. 지난번에 내 소파를 물어뜯었잖아."',
      context: 'Ross arrives at Monica\'s party with Marcel. Earlier, Marcel urinated on her coffee table, so Monica is not in a forgiving mood. Her blunt refusal sets off a short argument at the door, and it shows her strict, protective side as a host.',
      context_ko: '로스가 마르셀을 데리고 모니카의 파티에 도착하는 장면입니다. 앞서 마르셀이 그녀의 커피 테이블에 소변을 봤기 때문에 모니카는 쉽게 봐줄 마음이 없습니다. 그녀의 단호한 거절로 문 앞에서 짧은 말다툼이 벌어지며, 손님을 맞는 주인으로서 그녀의 깐깐하고 보호하려는 면이 드러납니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X9'
    },
    {
      phrase: 'He\'s not even jolly. It\'s all political.',
      partOfSpeech: 'expression',
      speaker: 'Joey',
      meaning: 'Joey complains that someone got the job for reasons unrelated to ability. "Jolly" describes Santa\'s cheerful nature, so "He\'s not even jolly" says the new guy is unqualified. "It\'s all political" means decisions are made through favoritism or connections rather than merit. It is a common way to describe office favoritism.',
      meaning_ko: '조이는 능력과 상관없는 이유로 누군가가 자리를 얻었다고 불평합니다. "Jolly"는 산타의 명랑한 성격을 뜻하므로, "He\'s not even jolly"는 새로 뽑힌 사람이 자격이 없다는 의미입니다. "It\'s all political"은 결정이 실력이 아니라 편애나 인맥으로 이루어진다는 뜻으로, 직장 내 편애를 말할 때 흔히 씁니다.',
      example: 'A: "They promoted Derek over you again?" B: "Yeah. He doesn\'t even know the software. It\'s all political."',

      context: 'Joey has just learned he did not get the department store Santa job back. The role went to someone sleeping with the store manager. Joey is bitter and sarcastic, and he mocks the choice as unfair.',
      context_ko: '조이가 백화점 산타 자리를 다시 얻지 못했다는 사실을 알게 된 장면입니다. 그 자리는 매장 매니저와 잠자리를 같이하는 사람에게 돌아갔습니다. 조이는 씁쓸하고 빈정거리는 말투로 그 선택을 부당하다고 비꼽니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X10'

    {
      phrase: 'What\'s an elf to do?',
      partOfSpeech: 'expression',
      speaker: 'Joey',
      meaning: '\"What\'s [person] to do?\" is a rhetorical expression of helplessness or resigned acceptance — similar to \"what choice do I have?\" or \"there\'s nothing to be done.\" Using a specific role (\"an elf\") instead of \"I\" adds self-aware humour: the speaker narrates their own predicament as if describing a character rather than themselves. It is the language of rueful dignity.',
      meaning_ko: '\"What\'s [사람] to do?\"는 무력감이나 체념적 수용을 표현하는 수사적 표현입니다 — \"선택이 없잖아\"나 \"어쩔 수 없어\"와 비슷합니다. \"I\" 대신 특정 역할(\"an elf\")을 사용하면 자의식적인 유머가 더해집니다: 화자가 자신을 묘사하기보다 마치 캐릭터를 묘사하듯 자신의 곤경을 중계하는 것입니다. 체념 어린 품위의 언어입니다.',
      example: 'A: \"The deadline moved up and now I\'m stuck working the weekend.\" B: \"Well, what\'s a project manager to do? Let\'s get it done.\"',
      example_ko: 'A: \"마감이 당겨져서 주말에 일해야 해.\" B: \"그럼 PM이 어떻게 하겠어? 그냥 해야지.\"',
      context: 'Joey has just learned he didn\'t get the department store Santa job — the role went to someone sleeping with the store manager. Instead, he will be one of Santa\'s helpers. His resigned, slightly wounded acceptance of his new title as \"an elf\" is a wonderfully comic moment of dignified defeat.',
      context_ko: '조이가 백화점 산타 자리를 못 얻었다는 것을 알게 되는 장면 — 그 역할은 매장 매니저와 자는 사람에게 돌아갔습니다. 대신 그는 산타의 조수가 됩니다. \"an elf\"로서 자신의 새 직함을 체념하며 약간 상처받은 듯 받아들이는 것이 훌륭하게 코믹한 위엄 있는 패배의 순간입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X11'

    {
      phrase: 'Are people eating my dip?',
      partOfSpeech: 'expression',
      speaker: 'Monica',
      meaning: 'A short, anxious check-in from the host — simultaneously a practical question and a request for validation. \"Are people eating [food]?\" is Monica\'s way of asking whether her effort is being appreciated. For her, food is not just sustenance but a form of care — whether guests eat what she made is how she measures the success of any gathering.',
      meaning_ko: '주최자의 짧고 불안한 확인 질문 — 동시에 실용적인 질문이자 인정에 대한 요청입니다. \"Are people eating [음식]?\"은 모니카가 자신의 노력이 감사받고 있는지 묻는 방식입니다. 그녀에게 음식은 단순한 먹거리가 아니라 보살핌의 형태입니다 — 손님들이 자신이 만든 것을 먹는지가 그녀에게는 어떤 모임의 성공을 가늠하는 척도입니다.',
      example: 'A: \"Is everyone enjoying themselves?\" B: \"Yes, they love it.\" A: \"Good. Are people eating my dip?\"',
      example_ko: 'A: \"다들 즐거운 것 같아?\" B: \"응, 다들 좋아해.\" A: \"다행이다. 내 딥 먹고 있어?\"',
      context: 'Monica emerges briefly from the chaos of the party to check on her artichoke dip. The question perfectly captures her: no matter what else is happening — the pact falling apart, Marcel wrecking things, Fun Bobby sobbing — her food being enjoyed is always the priority.',
      context_ko: '모니카가 파티의 혼란 속에서 잠깐 빠져나와 자신의 아티초크 딥을 확인하는 장면. 이 질문이 그녀를 완벽하게 포착합니다: 약속이 무너지든, 마르셀이 물건을 망가뜨리든, 펀 바비가 엉엉 울든 — 그녀의 음식이 즐겨지고 있는가가 항상 우선순위입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X12'
    },
    {
      phrase: 'I\'m gonna miss you, you scientist guy.',
      partOfSpeech: 'expression',
      speaker: 'Phoebe',
      meaning: 'The construction \"you [descriptor] [noun]\" — as in \"you wonderful person\" or \"you crazy kid\" — is an informal, affectionate way of addressing someone as if naming a quality of theirs is also naming them. Adding \"guy\" makes it casual and warm. Phoebe uses \"scientist guy\" as both his job title and a term of endearment — the two things are inseparable to her.',
      meaning_ko: '\"you [형용사/명사] [명사]\" 구조 — \"you wonderful person\"이나 \"you crazy kid\"처럼 — 는 마치 상대방의 어떤 특성을 이름 붙이는 것이 동시에 그들 자체를 이름 붙이는 것처럼, 비공식적이고 애정 어리게 누군가에게 말을 거는 방식입니다. \"guy\"를 더하면 더 캐주얼하고 따뜻해집니다. 피비는 \"scientist guy\"를 그의 직함이자 애칭으로 씁니다 — 그녀에게는 둘이 분리되지 않습니다.',
      example: 'A: \"Goodbye. Safe travels.\" B: \"I\'m gonna miss you, you adventure guy.\"',
      example_ko: 'A: \"잘 가. 안전하게 여행해.\" B: \"보고 싶을 거야, 이 모험가 녀석아.\"',
      context: 'Phoebe says goodbye to David as he leaves for Minsk — a research opportunity too important to pass up, despite their feelings for each other. The phrase \"you scientist guy\" says everything she loves about him in three words: his identity, his dedication, his particular type of person. It\'s one of the early seasons\' most genuinely touching goodbyes.',
      context_ko: '피비가 민스크로 떠나는 데이비드에게 작별 인사를 하는 장면 — 서로에 대한 감정이 있음에도 불구하고 놓치기에는 너무 중요한 연구 기회. \"you scientist guy\"라는 표현이 그녀가 그에 대해 좋아하는 모든 것을 세 단어로 담아냅니다: 그의 정체성, 그의 헌신, 그의 독특한 유형. 초기 시즌에서 가장 진심 어린 작별 인사 중 하나입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X13'
    },
    {
      phrase: 'That guy\'s going home with a note.',
      partOfSpeech: 'expression',
      speaker: 'Phoebe',
      meaning: 'A playful way to say someone is in trouble for misbehaving. The image comes from school, where a student who acts up is sent home with a note for their parents. Phoebe uses it about a noisy audience member, so the punishment sounds light and silly rather than harsh.',
      meaning_ko: '나쁜 행동을 해서 곤란해질 것이라고 장난스럽게 말하는 표현입니다. 말썽을 피운 학생이 부모에게 전할 쪽지를 들고 집에 가는 학교의 풍경에서 왔습니다. 피비는 떠드는 관객을 두고 이 말을 하여, 벌이 가혹하기보다 가볍고 우스꽝스럽게 들리게 합니다.',
      example: 'A: "Mr. Lee kept texting through the whole movie." B: "Yeah, that guy\'s going home with a note."',
      example_ko: 'A: "이 씨가 영화 내내 문자를 보내더라." B: "맞아, 쟤 이제 쪽지 들고 집에 가겠네."',
      context: 'Phoebe is performing at Central Perk when two noisy audience members, David and Max, keep talking. She stops her song to call them out, and her "going home with a note" line is a teacher-like jab. It is funny because she is so sweetly dramatic about the rudeness.',
      context_ko: '피비가 센트럴 퍼크에서 노래를 부르는 도중, 떠드는 두 관객 때문에 공연을 멈추고 그들을 지적하는 장면입니다. 그녀는 선생님처럼 "쪽지를 들고 집에 가겠네"라고 말하며 무례함을 가볍게 나무랍니다. 상대를 혼내는 말투가 다정하면서도 극적이라 웃음을 줍니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X14'
    },
    {
      phrase: 'But he\'s just phoning it in.',
      partOfSpeech: 'expression',
      speaker: 'Ross',
      meaning: '\"Phone it in\" means to do something with minimal effort or genuine engagement — to go through the motions without real investment. The phrase implies the person is technically present but emotionally absent, as if sending in their performance from a distance rather than truly being there. It is widely used about work, performances, relationships, and any situation where someone is doing the bare minimum.',
      meaning_ko: '\"Phone it in\"은 최소한의 노력이나 진정한 참여 없이 무언가를 하다는 뜻입니다 — 진정한 투자 없이 형식만 갖추는 것. 이 표현은 그 사람이 기술적으로는 존재하지만 감정적으로는 부재한다는 것을 내포합니다. 마치 실제로 그곳에 있는 것이 아니라 멀리서 자신의 역할을 보내는 것처럼. 일, 공연, 관계, 최소한의 것만 하는 상황에 대해 널리 쓰입니다.',
      example: 'A: \"His speech was technically fine.\" B: \"I know, but you could tell he was just phoning it in. No energy at all.\"',
      example_ko: 'A: \"그 사람 연설은 기술적으로는 괜찮았어.\" B: \"알아, 근데 그냥 형식적으로만 하는 거 티가 나더라. 에너지가 전혀 없잖아.\"',
      context: 'Ross laments that despite all his effort with Marcel — changing diapers, picking fleas — Marcel isn\'t reciprocating with genuine affection. He\'s physically present but emotionally checked out. The phrase \"phoning it in\" applied to a pet monkey is both hilariously accurate and genuinely a little heartbreaking.',
      context_ko: '로스가 마르셀을 위해 기저귀를 갈고 벼룩을 잡는 등 모든 노력을 기울이고 있음에도 불구하고 마르셀이 진정한 애정으로 보답하지 않는다고 한탄하는 장면. 몸은 있지만 감정적으로는 사라져 있습니다. \"phoning it in\"이 애완 원숭이에게 적용되는 것이 동시에 황당하게 정확하고 진심으로 약간 가슴 아픕니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E10X15'
    }
  ]
  };

  var S_NUM = 1;
  var E_NUM = 10;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        if (x.speaker) html += '<div class="expr-speaker">&#127939; ' + escHtml(x.speaker) + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
