    .expr-card { border-radius: 12px; padding: 18px 20px; margin: 0; }
    .expr-card:hover { transform: translateX(3px); }
    .expr-phrase { font-size: 1.06rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
    .expr-meaning { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 6px; }

    .btn-youtube { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 800; cursor: pointer; transition: all 0.22s; text-decoration: none; font-family: inherit; }
    .btn-youtube:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,0,0,0.4); }
    .btn-youtube.pending { background: var(--card2); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; pointer-events: none; opacity: 0.6; }
    .placeholder-slot { opacity: 0.45; border-style: dashed; }
  </style>

<script>
  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'Season 4, Episode 22',
    description: '15 natural English expressions from Season 4, Episode 22.',
    expressions: [
      {
        phrase: "I am so sick of being pregnant.",
        partOfSpeech: "expression",
        meaning: "Complete exhaustion with pregnancy.",
        example: "I am so sick of being pregnant. The only happiness I get is from a cup of coffee.",
        context: "Phoebe complains about being pregnant and uncomfortable.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "I'm never gonna get to be a best man.",
        partOfSpeech: "expression",
        meaning: "Lamenting a missed life opportunity.",
        example: "Come on, Ross. I don't have any brothers. I'm never gonna get to be a best man.",
        context: "Joey expresses disappointment at not being Ross's best man.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "That's it. From now on, you can be my best man.",
        partOfSpeech: "expression",
        meaning: "Making a definitive decision after frustration.",
        example: "From now on, Joey I want you to be my best man.",
        context: "Ross gives up and makes Joey the best man.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "Don't make me come in there!",
        partOfSpeech: "expression",
        meaning: "A warning to behave or face consequences.",
        example: "It's kicking one of the other babies. Oh. Don't make me come in there!",
        context: "Phoebe scolds one of the babies inside her.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "I chose not to hear that.",
        partOfSpeech: "expression",
        meaning: "Deliberately ignoring part of what was said.",
        example: "He just said, 'No strippers.' I chose not to hear that.",
        context: "Chandler ignores Ross's instructions not to hire strippers.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "We are throwing the most depressing baby shower.",
        partOfSpeech: "expression",
        meaning: "Realizing the inappropriateness of gifts.",
        example: "Oh, my God, we are throwing the most depressing baby shower.",
        context: "Rachel and Monica realize Phoebe won't keep the babies.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "The stripper stole the ring!",
        partOfSpeech: "expression",
        meaning: "Panicked realization of a theft.",
        example: "The stripper stole the ring! Chandler, get up, get up!",
        context: "Joey discovers the wedding ring is missing.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "This ship has sailed. You don't have to turn me in.",
        partOfSpeech: "expression",
        meaning: "Accepting responsibility for a mistake.",
        example: "Dude, I screwed up. You don't have to turn me in.",
        context: "Joey knows he made a major error.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "That ring is irreplaceable.",
        partOfSpeech: "expression",
        meaning: "Something that cannot be replaced due to its value.",
        example: "When my grandmother first came to this country, that ring and the clothes on her back were all she had.",
        context: "Emily explains the ring's family significance.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "It's a magic ring.",
        partOfSpeech: "idiom",
        meaning: "Something believed to bring good fortune.",
        example: "Every bride who's worn it has lived a long and happy life. So you might say it's a magic ring.",
        context: "Emily describes the ring's power.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "Well, you can't have the baby here!",
        partOfSpeech: "expression",
        meaning: "Expression of alarm at an inconvenient timing.",
        example: "Well, you can't have the baby here! I haven't sterilized the apartment since the guys moved out!",
        context: "Monica panics when Phoebe might go into labor.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "It's probably false labor.",
        partOfSpeech: "expression",
        meaning: "Assuring that labor pains are not the real thing.",
        example: "It's okay. It's probably false labor. They said that can happen near the end.",
        context: "Phoebe reassures about her contractions.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "You be cool. I'll let you play with my duck.",
        partOfSpeech: "expression",
        meaning: "An invitation after a party, with double meaning.",
        example: "Unless you want to hang around. Yeah. I'll let you play with my duck.",
        context: "Joey flirts with the stripper at the party.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "Cool Aunt Phoebe.",
        partOfSpeech: "idiom",
        meaning: "The fun, permissive aunt figure.",
        example: "You're gonna be the one they come to when they run away from home. You just get to be cool Aunt Phoebe.",
        context: "Monica describes Phoebe's future role as aunt.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "I want both you guys. You two are my best friends.",
        partOfSpeech: "expression",
        meaning: "Expressing deep friendship and gratitude.",
        example: "I get to choose my best man. I want both you guys. Both you guys should be up there with me.",
        context: "Ross chooses both Joey and Chandler as best men.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      }
    ]
  };

  var S_NUM = 4;
  var E_NUM = 22;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(x.meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(x.example) + '</div>';
        if (x.context) html += '<div class="expr-context">&#128205; ' + escHtml(x.context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
