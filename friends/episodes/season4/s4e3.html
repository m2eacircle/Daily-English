        example: 'Could we be more white trash?',
        example_ko: '우리가 더 저질스럽게 행동할 수 있을까?',

        context_ko: 'Monica는 Rachel에게 자신의 어머니를 변호하지 말라고 말한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E3X6'
      },
      {
        phrase: 'Get rid of that last little smidgen',
        partOfSpeech: 'expression',
        meaning: 'Remove or lose a small remaining amount of something',
        meaning_ko: '남은 작은 양의 무언가를 제거하거나 잃다',
        example: 'Get rid of that last little smidgen of self-respect.',
        example_ko: '마지막 남은 자존감을 없애 버렸어.',
        context: 'Monica jokes about catering for her mother',
        context_ko: 'Monica는 자신의 어머니를 위해 요리하는 것을 농담한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E3X7'
      },
      {
        phrase: 'It\'s in the quiche',
        partOfSpeech: 'expression',
        meaning: 'A problem or unwanted item ended up in food',
        meaning_ko: '음식에 문제나 원치 않는 물품이 들어갔다',
        example: 'Oh my God. It\'s in the quiche.',

        context_ko: 'Monica는 자신의 가짜 손톱이 키시에 떨어졌다는 것을 깨닫는다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E3X8'
      },
      {
        phrase: 'Don\'t panic',
        partOfSpeech: 'imperative',
        meaning: 'Stay calm during a stressful or emergency situation',
        meaning_ko: '스트레스나 응급 상황 중에 침착함을 유지하다',
        example: 'Okay, don\'t panic. I\'m gonna go to the store.',
        example_ko: '좋아, 당황하지 마. 나는 가게에 갈 거야.',
        context: 'Phoebe tries to reassure Monica about the nail',
        context_ko: 'Phoebe는 Monica를 손톱에 대해 안심시키려고 한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E3X9'
      },
      {
        phrase: 'Whoever finds it wins the prize',

        example_ko: '누가 찾든 상을 받지.',

      },
      {

        partOfSpeech: 'phrasal verb',
        meaning: 'Pretend to understand or agree while actually confused',
        meaning_ko: '실제로 혼란스러우면서 이해하거나 동의하는 척 하다',
        example: 'You just nod along even though you\'re not sure.',
        example_ko: '넌 잘 모르면서도 계속 고개를 끄덕여.',
        context: 'Encyclopedia salesman describes feeling left out',
        context_ko: '백과사전 판매원은 소외된 기분을 설명한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E3X11'
      },
      {
        phrase: 'Zero down and zero a month',
        partOfSpeech: 'expression',
        meaning: 'No money paid upfront or in monthly payments',
        meaning_ko: '선금 또는 월별 지불금 없음',
        example: 'How about zero down and zero a month?',
        example_ko: '선금도 없고 월금도 없으면 어떨까?',

        context_ko: 'Joey는 감당할 수 없는 백과사전을 협상한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E3X12'
      },
      {
        phrase: 'Blow up like Vesuvius',

        example: 'I can make you a legend.',
        example_ko: '나는 너를 전설로 만들 수 있어.',
        context: 'Chandler uses gossip as leverage with Joey',
        context_ko: 'Chandler는 Joey와의 협상에 가십을 사용한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E3X14'
      },
      {

        meaning: 'You did something that made me admire you',
        meaning_ko: '당신이 나를 감탄하게 만드는 뭔가를 했다',
        example: 'You really impressed me today.',
        example_ko: '넌 오늘 정말 나를 감동시켰어.',
        context: 'Monica\'s mother compliments her catering work',
        context_ko: 'Monica의 어머니는 그녀의 요리 일을 칭찬한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E3X15'
      }
    ]
  };

  var S_NUM = 4;
  var E_NUM = 3;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Coming Soon</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
