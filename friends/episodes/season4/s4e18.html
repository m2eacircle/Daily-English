    .expr-card { border-radius: 12px; padding: 18px 20px; margin: 0; }
    .expr-card:hover { transform: translateX(3px); }
    .expr-phrase { font-size: 1.06rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
    .expr-meaning { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 6px; }
    .expr-example { font-size: 0.82rem; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 8px; line-height: 1.6; }

    .expr-num { font-size: 0.68rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent2); margin-bottom: 7px; }
    .expr-actions { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; margin-top: 6px; }
    .btn-youtube { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 800; cursor: pointer; transition: all 0.22s; text-decoration: none; font-family: inherit; }
    .btn-youtube:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,0,0,0.4); }
    .btn-youtube.pending { background: var(--card2); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; pointer-events: none; opacity: 0.6; }
    .placeholder-slot { opacity: 0.45; border-style: dashed; }
  </style>
</head>

<script>
  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'Season 4, Episode 18',
    description: '15 natural English expressions from Season 4, Episode 18.',
    expressions: [
      {
        phrase: "Pregnant bellies look like a drum.",
        partOfSpeech: "idiom",
        meaning: "A joking observation about the large, round shape of a pregnant belly.",
        example: "She said my pregnant bellies look like a drum!",
        context: "Rachel makes a playful comment about Phoebe's pregnancy.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "Don't get me started.",
        partOfSpeech: "expression",
        meaning: "A warning to avoid bringing up a particular topic because you'll get upset or angry.",
        example: "Don't get me started about the baby name Frank Jr., Jr.!",
        context: "Phoebe wants to avoid discussing the confusing naming convention.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "I'm gonna play my songs on this drum.",
        partOfSpeech: "expression",
        meaning: "To use an alternative method or resource because the usual one is unavailable.",
        example: "My guitar doesn't fit, so I'm gonna play my songs on this drum.",
        context: "Phoebe explains a creative adaptation to her pregnancy.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "Ask you a big favor.",
        partOfSpeech: "expression",
        meaning: "To request something significant or important from someone.",
        example: "I came down to ask you a big favor.",
        context: "Phoebe approaches Rachel with an important request.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "Cooking soothes me.",
        partOfSpeech: "expression",
        meaning: "Cooking is calming and helps reduce stress or anxiety.",
        example: "Monica says, 'Please. Cooking soothes me.'",
        context: "Monica explains why she enjoys preparing the special meal.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "I am so good.",
        partOfSpeech: "expression",
        meaning: "Expressing pride or satisfaction in one's abilities or accomplishments.",
        example: "This rice is so... I am so good.",
        context: "Monica brags about the quality of her cooking.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "Farm birds really kind of freak me out.",
        partOfSpeech: "expression",
        meaning: "To find something disturbing or frightening.",
        example: "I'm sorry, but farm birds really kind of freak me out.",
        context: "Joshua expresses his discomfort with the farm animals.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "They can smell the fear.",
        partOfSpeech: "idiom",
        meaning: "Others can sense or detect when you are anxious or frightened.",
        example: "'They can smell the fear.' Joshua says nervously.",
        context: "A joking comment about the ducks reacting to his fear.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "That's a little weird.",
        partOfSpeech: "expression",
        meaning: "Something is strange, unusual, or unexpected.",
        example: "Um, this may be a little weird, but I've got a date here.",
        context: "Chandler tells his parents about his unexpected visitor.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "This place is a real babe magnet.",
        partOfSpeech: "idiom",
        meaning: "A place that attracts attractive people.",
        example: "This place is a real babe magnet.",
        context: "Joshua and Rachel discuss the appeal of the parents' house.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "You wore your nightie to dinner?",
        partOfSpeech: "expression",
        meaning: "Expressing surprise or disbelief at an unusual clothing choice.",
        example: "You wore your nightie to dinner? Oh, yeah.",
        context: "Rachel explains her awkward dinner outfit situation.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "I got nice boobs.",
        partOfSpeech: "expression",
        meaning: "A confident statement expressing self-acceptance or pride.",
        example: "It's all right. I got nice boobs.",
        context: "Rachel brushes off an embarrassing wardrobe malfunction.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "Carol really messed you up.",
        partOfSpeech: "expression",
        meaning: "Someone has emotionally damaged or negatively affected another person.",
        example: "She turned you into this untrusting, crazy, jealous sycophant.",
        context: "Rachel and Joey confront Ross about his paranoia.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "I hope Emily is a lesbian.",
        partOfSpeech: "expression",
        meaning: "An expression of frustration or defiance in response to being contradicted.",
        example: "Well, you know what? I hope Emily is a lesbian.",
        context: "Ross sarcastically responds to his friends' criticism.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      },
      {
        phrase: "You have to keep the name too.",
        partOfSpeech: "expression",
        meaning: "A condition or requirement that must be maintained alongside something else.",
        example: "Yeah, but you have to keep the name too.",
        context: "Phoebe agrees to name her baby Chandler on one condition.",
        youtubeUrl: "REPLACE_WITH_YOUTUBE_LINK"
      }
    ]
  };

  var S_NUM = 4;
  var E_NUM = 18;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(x.meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(x.example) + '</div>';
        if (x.context) html += '<div class="expr-context">&#128205; ' + escHtml(x.context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
