      {

        meaning_ko: '누군가가 누군가를 유혹한 것에 대해 놀라움을 표현하다',

        example: 'What is with all the negativity?',
        example_ko: '이 모든 부정성이 뭐야?',
        context: 'Chandler criticizes Monica\'s doubt',
        context_ko: 'Chandler는 Monica의 의심을 비판한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E6X6'
      },
      {
        phrase: 'I lend you money. Just get moving',
        partOfSpeech: 'expression',
        meaning: 'Offer financial help to motivate action',
        meaning_ko: '행동을 동기부여하기 위해 재정 지원을 제공하다',
        example: 'I will lend you money. Just get moving!',
        example_ko: '나는 너에게 돈을 빌려줄 거야. 그냥 움직여!',
        context: 'Chandler offers to finance Monica\'s catering',
        context_ko: 'Chandler는 Monica의 요리를 재정 지원하기를 제안한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E6X7'
      },
      {
        phrase: 'So I went. I be\'d',
        partOfSpeech: 'expression',
        meaning: 'Playfully confirm doing what someone said',
        meaning_ko: '누군가가 말한 것을 재미있게 확인하다',
        example: 'You told me to go and be a caterer. So I went. I be\'d.',
        example_ko: '넌 나에게 가서 파티 음식 공급업자가 되라고 했어. 그래서 나는 갔어. 나는 되었어.',
        context: 'Monica humorously responds to Chandler',
        context_ko: 'Monica는 Chandler에게 재미있게 응답한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E6X8'
      },
      {
        phrase: 'I acted like a bank',
        partOfSpeech: 'expression',
        meaning: 'Behaved like expecting immediate repayment',
        meaning_ko: '즉각적인 상환을 기대하는 것처럼 행동했다',
        example: 'Sorry I acted like a bank.',
        example_ko: '내가 은행처럼 행동해서 미안해.',
        context: 'Chandler apologizes for his attitude',
        context_ko: 'Chandler는 자신의 태도에 대해 사과한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E6X9'
      },
      {
        phrase: 'Have a seat',
        partOfSpeech: 'expression',
        meaning: 'Polite invitation to sit down',
        meaning_ko: '앉으라는 정중한 초대',
        example: 'Have a seat.',
        example_ko: '앉아.',
        context: 'Ross invites Emily in from outside',
        context_ko: 'Ross는 Emily를 밖에서 안으로 초대한다',

      },
      {

        partOfSpeech: 'expression',

        example: 'Don\'t take this the wrong way but your place has a weird smell.',
        example_ko: '이상하게 받아들이지 마, 하지만 너의 집에는 이상한 냄새가 있어.',
        context: 'Emily tactfully criticizes Ross\'s apartment',
        context_ko: 'Emily는 Ross의 아파트를 세심하게 비판한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E6X11'
      },
      {
        phrase: 'I hate this part',
        partOfSpeech: 'expression',
        meaning: 'Dislike an awkward or difficult moment',
        meaning_ko: '어색하거나 어려운 순간을 싫어하다',
        example: 'No. I hate this part.',
        example_ko: '아니. 나는 이 부분을 싫어해.',
        context: 'Monica dislikes settling the funeral bill',
        context_ko: 'Monica는 장례식 청구서를 정산하는 것을 싫어한다',

      },

        example_ko: '지불에 관한 작은 문제가 있어.',
        context: 'Monica awkwardly asks for payment',
        context_ko: 'Monica는 어색하게 지불을 요청한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E6X13'
      },
      {
        phrase: 'She\'s not 11',
        partOfSpeech: 'expression',
        meaning: 'Imply something is inappropriate for age',
        meaning_ko: '무언가가 나이에 부적절하다는 것을 암시하다',
        example: 'You can\'t give her that. She\'s not 11!',
        example_ko: '넌 그것을 그녀에게 줄 수 없어. 그녀는 11살이 아니야!',
        context: 'Monica criticizes Joey\'s pen-clock gift',
        context_ko: 'Monica는 Joey의 펜 시계 선물을 비판한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E6X14'
      },
      {
        phrase: 'You like this girl, right',

        example: 'Listen, you like this girl, right?',
        example_ko: '들어봐, 넌 이 여자를 좋아하지, 맞아?',
        context: 'Chandler questions Ross about Emily',
        context_ko: 'Chandler는 Ross에게 Emily에 대해 질문한다',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S4E6X15'
      }
    ]
  };

  var S_NUM = 4;
  var E_NUM = 6;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Coming Soon</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
