  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'The One with Two Parts Part One',
    description: 'Chandler plans to propose to Monica. Paul finally opens up about his childhood.',
    expressions: [
      {
        phrase: 'It\'s so hard',
        partOfSpeech: 'phrase',
        meaning: 'This means something is very difficult to do or understand. It expresses frustration or difficulty with a task or decision. It is used when someone is struggling with a problem.',
        example: 'Chandler is trying to pick out an engagement ring for Monica and tells Joey: "I can\'t figure this out. It\'s so hard." He cannot decide between different ring styles.',
        context: 'Chandler struggling to choose a ring',
        youtubeUrl: 'REPLACE_S6E23X1'
      },
      {
        phrase: 'Paper cut',
        partOfSpeech: 'noun',
        meaning: 'A paper cut is a small, sharp cut on your skin caused by paper. Though small, paper cuts hurt surprisingly much. It is a common minor injury that happens unexpectedly.',
        example: 'While looking at ring brochures, Joey gets a small cut from the paper and exclaims "Ow! Paper cut!" even though it is just a minor injury.',
        context: 'Joey getting hurt by paper while helping Chandler',
        youtubeUrl: 'REPLACE_S6E23X2'
      },
      {
        phrase: 'I trust you',
        partOfSpeech: 'phrase',
        meaning: 'To trust someone means to believe they are honest and reliable. When you trust someone, you feel confident they will not betray your secrets or let you down. Trust is a sign of a strong relationship.',
        example: 'Chandler tells Joey why he confided in him about the engagement ring: "Well, that\'s because I trust you, and we\'re best friends." He believes Joey will keep his secret.',
        context: 'Chandler explaining why he told Joey',
        youtubeUrl: 'REPLACE_S6E23X3'
      },
      {
        phrase: 'Not knocking pays off',
        partOfSpeech: 'idiom',
        meaning: 'This is a humorous expression about Joey not knocking before entering Chandler\'s bathroom. "Paying off" means giving a good result or benefit. It jokes that breaking a rule sometimes has unexpected positive consequences.',
        example: 'Joey discovered Chandler\'s engagement ring proposal by walking in on him without knocking. He says: "Well, once again, not knocking pays off." His rude behavior led to a great discovery.',
        context: 'Joey joking about discovering the ring',
        youtubeUrl: 'REPLACE_S6E23X4'
      },
      {
        phrase: 'Just open up',
        partOfSpeech: 'phrasal verb',
        meaning: 'To open up means to share your feelings and be honest about your emotions. It means to become less guarded and more vulnerable. When someone opens up, they express what they really feel.',
        example: 'Rachel tells her friend that Paul is private and she says "I wish I could get him to open up a bit. Share some feelings." She wants him to be more emotionally expressive.',
        context: 'Rachel wishing Paul would share his feelings',
        youtubeUrl: 'REPLACE_S6E23X5'
      },
      {
        phrase: 'Think of him as a jar of pickles',
        partOfSpeech: 'metaphor',
        meaning: 'This is a funny metaphor comparing a closed-off person to a jar of pickles that is hard to open. It suggests someone needs the right technique to help them "open up." The comparison is silly and humorous.',
        example: 'Phoebe gives Rachel advice: "You just have to think of him as a jar of pickles that won\'t open." This is her funny way of saying Paul is hard to connect with emotionally.',
        context: 'Phoebe\'s advice to Rachel about Paul',
        youtubeUrl: 'REPLACE_S6E23X6'
      },
      {
        phrase: 'Dig a little deeper',
        partOfSpeech: 'idiom',
        meaning: 'To dig deeper means to investigate more or think more carefully about something. It means to look beyond the surface and find more information or truth. It is often used when someone is missing an obvious point.',
        example: 'Phoebe tells Ross: "Come on, Ross. You\'re a paleontologist. Dig a little deeper." She is joking that he should use his excavation skills to figure out why Chandler is mad.',
        context: 'Phoebe hinting Ross should figure out the problem',
        youtubeUrl: 'REPLACE_S6E23X7'
      },
      {
        phrase: 'Talk to me',
        partOfSpeech: 'phrase',
        meaning: 'This expression is a request for someone to communicate and share what is on their mind. It shows you want to listen and understand. It is an invitation for open conversation and honesty.',
        example: 'Rachel and Paul go on a date, and Rachel tells him: "But first, wait, talk to me, talk to me. Tell me about your day." She is asking him to open up and communicate.',
        context: 'Rachel encouraging Paul to communicate',
        youtubeUrl: 'REPLACE_S6E23X8'
      },
      {
        phrase: 'Still waters run deep',
        partOfSpeech: 'idiom',
        meaning: 'This saying means that quiet, calm people often have more depth and complexity than they show on the surface. A person who seems quiet might have strong feelings and interesting thoughts. It suggests not judging by appearances.',
        example: 'Rachel tells Paul: "You know, they say that still waters run deep... and I want to swim in yours." She is saying his quiet nature hides deeper feelings she wants to know about.',
        context: 'Rachel complimenting Paul\'s mysterious nature',
        youtubeUrl: 'REPLACE_S6E23X9'
      },
      {
        phrase: 'I don\'t know anything about you',
        partOfSpeech: 'phrase',
        meaning: 'This means Rachel feels she has not learned personal details about Paul despite dating him. It expresses frustration that Paul does not share his life story, childhood, or personal experiences with her.',
        example: 'Rachel says to Paul: "I don\'t know anything about you. You know, like your childhood. Tell me about your childhood." She wants to understand him better as a person.',
        context: 'Rachel frustrated with Paul\'s lack of sharing',
        youtubeUrl: 'REPLACE_S6E23X10'
      },
      {
        phrase: 'Can\'t complain',
        partOfSpeech: 'idiom',
        meaning: 'This is a casual way of saying things are going fine or well. It means you do not have anything to complain about. It is often used as a simple response when asked how things are going.',
        example: 'When Phoebe asks Paul "So how are things going with you?" he responds "Can\'t complain." This is his very brief way of saying everything is fine.',
        context: 'Paul\'s response to Phoebe\'s question',
        youtubeUrl: 'REPLACE_S6E23X11'
      },
      {
        phrase: 'You gotta say something',
        partOfSpeech: 'phrase',
        meaning: 'This means you must speak up and express yourself or provide information. It is used when silence is not acceptable and communication is needed. It urges someone to break their silence.',
        example: 'Throughout the episode, Rachel keeps pushing Paul to communicate, essentially saying he needs to share his thoughts and feelings with her instead of staying silent.',
        context: 'Rachel\'s repeated request for Paul to communicate',
        youtubeUrl: 'REPLACE_S6E23X12'
      },
      {
        phrase: 'The perfect ring',
        partOfSpeech: 'noun phrase',
        meaning: 'The perfect ring is the ideal engagement ring that someone has been searching for. It represents the right choice and has all the qualities desired. Finding the perfect ring is an important part of a proposal.',
        example: 'Chandler and Joey go to many jewelry stores looking for the right ring. Chandler says: "I can\'t find the perfect ring." He wants to find one that is just right for Monica.',
        context: 'Chandler\'s search for Monica\'s ring',
        youtubeUrl: 'REPLACE_S6E23X13'
      },
      {
        phrase: 'I know how to haggle',
        partOfSpeech: 'phrase',
        meaning: 'To haggle means to negotiate the price of something, usually to try to pay less. It is a back-and-forth discussion about price. Knowing how to haggle means having skill at negotiating deals.',
        example: 'When they find a ring, Chandler says to Joey: "I know how to haggle. So let me handle this from here on out." He wants to negotiate a lower price for the expensive ring.',
        context: 'Chandler taking charge of the ring purchase',
        youtubeUrl: 'REPLACE_S6E23X14'
      },
      {
        phrase: 'Will you marry me?',
        partOfSpeech: 'question',
        meaning: 'This is the traditional proposal question. It asks someone to marry you and commit to a lifelong relationship. It is the most important romantic question someone can ask. It expresses deep love and commitment.',
        example: 'When Chandler sees the perfect ring, he asks the jeweler to hold it and ask him the question. The jeweler says: "Will you marry me?" and Chandler knows it is the right ring.',
        context: 'Testing the ring with a proposal question',
        youtubeUrl: 'REPLACE_S6E23X15'
      }
    ]
  };

  var S_NUM = 6;
  var E_NUM = 23;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(x.meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(x.example) + '</div>';
        if (x.context) html += '<div class="expr-context">&#128205; ' + escHtml(x.context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
