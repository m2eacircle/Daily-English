  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'The One with Two Parts Part Two',
    description: 'Chandler proposes to Monica. Monica encounters her ex-boyfriend Richard at dinner.',
    expressions: [
      {
        phrase: 'The big night',
        partOfSpeech: 'noun phrase',
        meaning: 'This refers to an important, special, or significant evening when something major will happen. The big night is one you have been waiting for or preparing for. It is an event you are nervous or excited about.',
        example: 'Chandler tells his friends: "Tonight\'s the big night." He is referring to the evening when he plans to propose to Monica.',
        context: 'Chandler preparing for the proposal',
        youtubeUrl: 'REPLACE_S6E24X1'
      },
      {
        phrase: 'It\'ll be perfect',
        partOfSpeech: 'phrase',
        meaning: 'This expression shows confidence that something will go exactly as planned or desired. It means you believe everything will work out wonderfully. It expresses optimism about a future event.',
        example: 'Chandler describes his proposal plan and says confidently: "It\'ll be perfect. We\'ll go to her favorite restaurant." He is certain his proposal will be romantic and successful.',
        context: 'Chandler describing his proposal plan',
        youtubeUrl: 'REPLACE_S6E24X2'
      },
      {
        phrase: 'Sounds perfect',
        partOfSpeech: 'phrase',
        meaning: 'This is an expression of approval and agreement that a plan sounds wonderful. When something sounds perfect, it seems like exactly what you want. It shows enthusiasm for an idea.',
        example: 'When Chandler finishes describing his proposal plan, Joey responds: "Sounds perfect!" He approves of Chandler\'s romantic ideas.',
        context: 'Joey approving Chandler\'s proposal plan',
        youtubeUrl: 'REPLACE_S6E24X3'
      },
      {
        phrase: 'You\'ll mess up',
        partOfSpeech: 'phrase',
        meaning: 'To mess up means to make a mistake or handle something badly. This expression predicts that someone will not succeed or will do something wrong. It is a prediction of failure.',
        example: 'Phoebe jokes that Chandler will fail at the proposal and says: "You\'ll mess up. Let me do it." She is teasing him about his ability to execute the plan.',
        context: 'Phoebe joking about Chandler\'s proposal',
        youtubeUrl: 'REPLACE_S6E24X4'
      },
      {
        phrase: 'If she says no',
        partOfSpeech: 'phrase',
        meaning: 'This expresses a hypothetical situation where someone rejects a proposal or request. It is used to discuss what might happen if something goes wrong. It shows uncertainty about the outcome.',
        example: 'Joey jokingly asks Chandler: "If she says no, can I have the ring?" He is playing with the idea that Monica might refuse the proposal.',
        context: 'Joey making a joke about Monica refusing',
        youtubeUrl: 'REPLACE_S6E24X5'
      },
      {
        phrase: 'She won\'t say no',
        partOfSpeech: 'phrase',
        meaning: 'This is a confident statement that someone will accept a proposal. It shows certainty and belief in a positive outcome. It expresses faith in a successful result.',
        example: 'Chandler responds to Joey confidently: "She won\'t say no." He is certain that Monica will accept his proposal.',
        context: 'Chandler expressing confidence Monica will say yes',
        youtubeUrl: 'REPLACE_S6E24X6'
      },
      {
        phrase: 'It\'s gone',
        partOfSpeech: 'phrase',
        meaning: 'Something is gone when it has disappeared or is no longer there. It means something cannot be found or has been taken away. It is used when something that was present is now missing.',
        example: 'Monica wants Chandler to show her the ring, but he tells her: "It\'s gone." He is saying that Phoebe has taken or hidden the ring.',
        context: 'Chandler telling Monica about the hidden ring',
        youtubeUrl: 'REPLACE_S6E24X7'
      },
      {
        phrase: 'All jokes aside',
        partOfSpeech: 'idiom',
        meaning: 'This expression means to stop joking and speak seriously about something important. It signals that what follows is sincere and needs serious attention. It marks a shift from humor to seriousness.',
        example: 'Elizabeth\'s brother asks Ross a serious question: "I have a question. All jokes aside. Where is this relationship going?" He wants a genuine answer, not joking around.',
        context: 'Elizabeth\'s brother questioning Ross seriously',
        youtubeUrl: 'REPLACE_S6E24X8'
      },
      {
        phrase: 'Long-term thing',
        partOfSpeech: 'noun phrase',
        meaning: 'A long-term thing is a relationship or situation that will last for a long time into the future. It is something meant to be permanent or serious, not temporary. It shows commitment and deep connection.',
        example: 'Elizabeth\'s brother asks Ross: "Do you see this as long-term thing?" He is asking if Ross plans to have a serious, lasting relationship with Elizabeth.',
        context: 'Questioning Ross about commitment to Elizabeth',
        youtubeUrl: 'REPLACE_S6E24X9'
      },
      {
        phrase: 'Chronological age difference',
        partOfSpeech: 'noun phrase',
        meaning: 'Chronological age difference is the actual number of years between two people\'s ages. It is the measurable gap in how old each person is. It refers to the concrete fact of age separation.',
        example: 'Ross defends his relationship: "Yes, there is a chronological age difference." He admits there is a 12-year age gap between him and Elizabeth.',
        context: 'Ross defending the age difference',
        youtubeUrl: 'REPLACE_S6E24X10'
      },
      {
        phrase: 'I\'m making money now',
        partOfSpeech: 'phrase',
        meaning: 'This means you have started earning income or now have financial resources. It expresses the pride or satisfaction of being financially independent. It suggests newfound ability to afford things.',
        example: 'When asked to go to the charity event, Joey says: "I\'m making money now. It\'s time I give some back." He is proud to contribute to charity with his new earnings.',
        context: 'Joey wanting to contribute to the charity',
        youtubeUrl: 'REPLACE_S6E24X11'
      },
      {
        phrase: 'Silent auction',
        partOfSpeech: 'noun phrase',
        meaning: 'A silent auction is a type of auction where people write down bids on items instead of calling them out loud. The highest written bid wins the item. It is a quiet, written form of bidding.',
        example: 'A charity representative explains: "This is a silent auction. They lay the stuff here. You write down your offer. The highest bid gets it."',
        context: 'Explaining how the auction works',
        youtubeUrl: 'REPLACE_S6E24X12'
      },
      {
        phrase: 'Don\'t guess, you buy',
        partOfSpeech: 'phrase',
        meaning: 'This means that in an auction, you do not guess the price—you bid money to purchase items. When you bid at an auction, you are making a financial commitment. It emphasizes the difference between guessing and actual purchasing.',
        example: 'When Joey guesses the boat\'s price instead of bidding, someone tells him: "Joey, it is an auction. You don\'t guess. You buy!" He has accidentally won the boat by making a bid.',
        context: 'Explaining that Joey accidentally bought a boat',
        youtubeUrl: 'REPLACE_S6E24X13'
      },
      {
        phrase: 'Congratulations on your new boat',
        partOfSpeech: 'phrase',
        meaning: 'This is a formal congratulation on winning or obtaining something valuable. It is often said with irony when the person did not actually mean to win it. It marks the moment someone realizes their mistake.',
        example: 'The auctioneer tells Joey: "Congratulations on your new boat, Joey Tribbiani." Joey suddenly realizes he has accidentally won the boat for $20,000.',
        context: 'Announcing Joey\'s accidental boat purchase',
        youtubeUrl: 'REPLACE_S6E24X14'
      },
      {
        phrase: 'I make jokes when I\'m uncomfortable',
        partOfSpeech: 'phrase',
        meaning: 'This explains that someone uses humor as a defense mechanism when feeling nervous or awkward. It means they joke to cope with difficult social situations. It is a way to handle stress through comedy.',
        example: 'When Chandler encounters Monica\'s ex-boyfriend Richard at the restaurant and feels awkward, he says: "I\'m Chandler. I make jokes when I\'m uncomfortable."',
        context: 'Chandler explaining his nervous habit',
        youtubeUrl: 'REPLACE_S6E24X15'
      }
    ]
  };

  var S_NUM = 6;
  var E_NUM = 24;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(x.meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(x.example) + '</div>';
        if (x.context) html += '<div class="expr-context">&#128205; ' + escHtml(x.context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
