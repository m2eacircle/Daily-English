  var EP_DATA = {
    available: true,
    title: 'The One with the Proposal',
    description: 'Monica and Chandler get engaged at the museum. Rachel crashes a romantic getaway.',
    expressions: [
      {
        phrase: 'What\'s the matter?',
        partOfSpeech: 'idiom',
        meaning: 'This expression asks someone what is troubling them or causing concern. It is used when you notice someone seems upset or worried and you want to understand the problem. It shows empathy and willingness to listen.',

      {

        meaning: 'To let something go means to stop worrying about it, to accept it, and move forward. It means you should stop holding onto frustration and accept a situation you cannot change. It is about releasing anger or disappointment.',
        example: 'Chandler teases Ross about being interested in fossils, making jokes about Elizabeth\'s father. Ross gets frustrated and Chandler tells him to "let it go" and stop making those jokes.',
        context: 'Chandler talking to Ross about his fossil jokes',
        youtubeUrl: 'REPLACE_S6E22X2'
      },
      {
        phrase: 'Soaking up the culture',
        partOfSpeech: 'phrasal verb',
        meaning: 'To soak up culture means to absorb and experience art, music, history, and traditions. When you go to a museum or cultural event, you are soaking up culture. It suggests enjoying and learning from artistic and historical experiences.',
        example: 'The girls go to the museum for the art exhibit. One of them says proudly: "I love museums. Soaking up all the culture." This shows they are enjoying the cultural experience.',
        context: 'Girls arriving at the museum',
        youtubeUrl: 'REPLACE_S6E22X3'
      },
      {
        phrase: 'Big surprise',
        partOfSpeech: 'noun phrase',
        meaning: 'A big surprise is something unexpected and exciting that happens to you. It is something you did not know was going to happen and it makes you feel amazed or delighted. Big surprises are often special events or gifts.',
        example: 'Rachel tells her friends that Paul is taking her to dinner and "he said he has a big surprise planned." She is excited but does not know what the surprise will be.',
        context: 'Rachel talking about Paul\'s dinner plans',
        youtubeUrl: 'REPLACE_S6E22X4'
      },
      {
        phrase: 'It can\'t hurt',
        partOfSpeech: 'idiom',
        meaning: 'This expression means that doing something will not cause any problems or harm. It suggests that trying something has no risk and might help you. It encourages someone to try something even if it may not work.',
        example: 'Monica does not want to put her name on the wedding venue list. Rachel persuades her by saying "it can\'t hurt to put your name down. If in two years you\'re not engaged, you just don\'t use it."',
        context: 'Rachel encouraging Monica to book the wedding venue',
        youtubeUrl: 'REPLACE_S6E22X5'
      },
      {
        phrase: 'I\'m funny like that',
        partOfSpeech: 'idiom',
        meaning: 'This is a humorous way of saying that you change your mind unexpectedly or behave in an unpredictable way. It means you do things that are surprising or amusing because of your personality. It is often used to make a joke about your own behavior.',
        example: 'Elizabeth\'s father tells Ross: "I accept the fact that you\'re going out with her. But then I changed my mind. I\'m funny like that." He is joking about how he suddenly changed his decision.',
        context: 'Elizabeth\'s father telling Ross he forbids the relationship',
        youtubeUrl: 'REPLACE_S6E22X6'
      },
      {
        phrase: 'A man with a plan',
        partOfSpeech: 'noun phrase',
        meaning: 'This expression describes someone who is organized, decisive, and knows what they want to do. A man with a plan is someone who has thought ahead and is ready to take action to achieve his goals. It shows respect for someone who is prepared.',
        example: 'Elizabeth\'s father threatens to tell the university about Ross and have him fired. Ross is impressed and says sarcastically "Oh, a man with a plan."',
        context: 'Ross responding to Elizabeth\'s father\'s threat',
        youtubeUrl: 'REPLACE_S6E22X7'
      },
      {
        phrase: 'Get your picture back up on the wall',
        partOfSpeech: 'phrasal verb',
        meaning: 'This means to restore or regain something you had before. In this case, it refers to Joey\'s picture being displayed again on the wall of fame at the dry cleaner. It means to return to a position of honor or recognition after losing it.',
        example: 'Chandler tells Joey: "This is so exciting. You get your picture back up on the wall of fame." Joey had his picture removed when he was fired from Days of Our Lives.',
        context: 'Chandler talking to Joey about his return to fame',
        youtubeUrl: 'REPLACE_S6E22X8'
      },
      {
        phrase: 'A smug Belushi bastard',
        partOfSpeech: 'noun phrase',
        meaning: 'Smug means acting superior or self-satisfied. A bastard is an insulting term for a person. This expression is very rude and used when someone is angry at another person for acting superior or laughing at them. It is quite strong language.',

        youtubeUrl: 'REPLACE_S6E22X9'
      },
      {
        phrase: 'Jog your memory',
        partOfSpeech: 'phrasal verb',
        meaning: 'To jog someone\'s memory means to remind them of something they have forgotten. It is used when you want to help someone remember something by giving them a hint or showing them something. It is like triggering their memory.',

      {
        phrase: 'Offensive to my people',

        youtubeUrl: 'REPLACE_S6E22X12'

      {

        meaning: 'This is a simple compliment that expresses admiration for a location or building. It is used to show appreciation for nice surroundings. It is a polite way to say you like where you are.',

        youtubeUrl: 'REPLACE_S6E22X13'
      },
      {
        phrase: 'It\'s so secluded up here',

        youtubeUrl: 'REPLACE_S6E22X15'
      }
    ]
  };

  var S_NUM = 6;
  var E_NUM = 22;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(x.meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(x.example) + '</div>';
        if (x.context) html += '<div class="expr-context">&#128205; ' + escHtml(x.context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
