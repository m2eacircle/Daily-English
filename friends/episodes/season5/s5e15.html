<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends S5E15 &mdash; Daily English</title>
  <link rel="stylesheet" href="../../../css/style.css">
  <style>
    .expr-card { border-radius: 12px; padding: 18px 20px; margin: 0; }
    .expr-card:hover { transform: translateX(3px); }
    .expr-phrase { font-size: 1.06rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
    .expr-meaning { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 6px; }
    .expr-example { font-size: 0.82rem; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 8px; line-height: 1.6; }
    .expr-context { font-size: 0.77rem; color: var(--muted); margin-bottom: 8px; }
    .expr-num { font-size: 0.68rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent2); margin-bottom: 7px; }
    .expr-actions { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; margin-top: 6px; }
    .btn-youtube { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 800; cursor: pointer; transition: all 0.22s; text-decoration: none; font-family: inherit; }
    .btn-youtube:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,0,0,0.4); }
    .btn-youtube.pending { background: var(--card2); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; pointer-events: none; opacity: 0.6; }
    .placeholder-slot { opacity: 0.45; border-style: dashed; }
  </style>
</head>
<body>

  </div>
  <div class="topbar-right">
    <a class="m2ea-link" href="https://www.m2eacircle.com/entertainment/index.html" target="_blank" rel="noopener">
      <span class="m2ea-icon">&#127760;</span><span class="label">m2ea Circle</span>

  <div class="page-wrap">

    <nav class="breadcrumb">

          onerror="this.src='../../images/s5e15.png';this.onerror=function(){this.parentElement.innerHTML='&#127916;';};">
      </div>
      <div class="page-header-info">
        <div class="page-header-title">Friends &mdash; S5E15: Season 5, Episode 15</div>
        <div class="page-header-meta">15 English Expressions <div class="page-header-meta">Expressions coming soon.</div> Korean Translations</div>
        <div class="page-header-actions">

            onclick="toggleBookmark('episode','episode-friends-s5e15','📋 Friends S5E15','friends/episodes/season5/s5e15.html')">

<script src="../../../js/i18n.js"></script>
<script src="../../../js/app.js"></script>
<script>
  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'Season 5, Episode 15',
    description: '15 English expressions from Friends S5E15: Season 5 finale—Chandler and Monica\'s relationship exposed to Ross, Chandler panics about commitment, Ross stands on principles and throws a party, Joey struggles with his petite girlfriend\'s punches.',
    expressions: [
      {
        phrase: 'I\'m going on the lam',
        partOfSpeech: 'expression',
        meaning: 'I am fleeing/running away to escape',
        example: 'Oh, I am going on the lam.',
        context: 'Chandler tries to escape after Ross finds out about Monica',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X1'
      },
      {
        phrase: 'We had a good run',
        partOfSpeech: 'expression',
        meaning: 'we had a good period/lasted a long time',
        example: 'Well, listen, we had a good run.',
        context: 'Chandler thinks he has to break up with Monica',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X2'
      },
      {
        phrase: 'I\'m in love with her',
        partOfSpeech: 'expression',
        meaning: 'I have romantic feelings for her',
        example: 'I love her. Okay? I am in love with her.',
        context: 'Chandler confesses his love to Ross',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X3'
      },
      {
        phrase: 'you didn\'t tell me',
        partOfSpeech: 'expression',
        meaning: 'you failed to inform me',
        example: 'You all knew and you did not tell me?',
        context: 'Ross is upset that everyone knew about Monica and Chandler',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X4'
      },
      {
        phrase: 'We were worried about you',
        partOfSpeech: 'expression',
        meaning: 'we were concerned for your wellbeing',
        example: 'Well, Ross, we were worried about you, okay?',
        context: 'Rachel explains why the group kept the secret',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X5'
      },
      {
        phrase: 'let these two love birds get back down to business',
        partOfSpeech: 'expression',
        meaning: 'let them resume their romantic/intimate activities',
        example: 'Let these two love birds get back down to business.',
        context: 'Joey encourages Chandler and Monica to continue',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X6'
      },
      {
        phrase: 'I call godfather',
        partOfSpeech: 'expression',
        meaning: 'I claim/reserve the position of godfather',
        example: 'I call godfather.',
        context: 'Joey jokes about being godfather to their potential children',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X7'
      },
      {
        phrase: 'big zero-gravity moon steps',
        partOfSpeech: 'expression',
        meaning: 'a very big/exaggerated leap in planning',
        example: 'Yeah, big zero-gravity moon steps.',
        context: 'Chandler notes they\'re planning too far ahead',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X8'
      },
      {
        phrase: 'She keeps punching me',
        partOfSpeech: 'expression',
        meaning: 'she repeatedly hits me playfully',
        example: 'She keeps punching me.',
        context: 'Joey complains about his tiny girlfriend\'s strong punches',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X9'
      },
      {
        phrase: 'a very tiny, but a very real bat',
        partOfSpeech: 'expression',
        meaning: 'something small but still powerful/harmful',
        example: 'It feels like someone is hitting me with a very tiny, but a very real bat.',
        context: 'Joey describes the pain from his small girlfriend\'s punches',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X10'
      },
      {
        phrase: 'I\'ve lived here for 25 minutes',
        partOfSpeech: 'expression',
        meaning: 'I just arrived/moved in very recently',
        example: 'Well, the guy\'s worked here for 25 years. Yes, but I have lived here for 25 minutes.',
        context: 'Ross refuses to pay the building\'s handyman gift on principle',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X11'
      },
      {
        phrase: 'to me he\'s just \"man\"',
        partOfSpeech: 'expression',
        meaning: 'I only know him as a generic person, not specifically Howard',
        example: 'Yes, but to me he is just \"man.\"',
        context: 'Ross explains he doesn\'t know Howard well enough',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X12'
      },
      {
        phrase: 'I\'m a guy who stands up for what he believes in',
        partOfSpeech: 'expression',
        meaning: 'I have principles and values that I won\'t compromise',
        example: 'I am just a guy who stands up for what he believes in.',
        context: 'Ross defends his refusal to pay for the handyman gift',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X13'
      },
      {
        phrase: 'baby fever',
        partOfSpeech: 'expression',
        meaning: 'an obsessive desire to have babies',
        example: 'You want babies. You have baby fever.',
        context: 'Chandler accuses Monica of being obsessed with having children',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X14'
      },
      {
        phrase: 'turn the heat down on this pressure cooker',
        partOfSpeech: 'idiom',
        meaning: 'reduce the intensity/pressure in this situation',
        example: 'Why do not we turn the heat down on this pressure cooker?',
        context: 'Chandler tries to ease Monica\'s expectations about their future',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E15X15'
      }
    ]
  };

  var S_NUM = 5;
  var E_NUM = 15;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Coming Soon</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
</html>
