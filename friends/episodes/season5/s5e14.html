    .expr-card { border-radius: 12px; padding: 18px 20px; margin: 0; }

    .expr-phrase { font-size: 1.06rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
    .expr-meaning { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 6px; }
    .expr-example { font-size: 0.82rem; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 8px; line-height: 1.6; }
    .expr-context { font-size: 0.77rem; color: var(--muted); margin-bottom: 8px; }

<script>
  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'Season 5, Episode 14',
    description: '15 English expressions from Friends S5E14: Monica-Chandler relationship secret gets out; Phoebe, Joey, and Rachel play a trick; Ross competes for Ugly Naked Guy\'s apartment; layered secrets and deception comedy.',
    expressions: [
      {
        phrase: 'I\'m going to miss that big old squishy butt',
        partOfSpeech: 'expression',
        meaning: 'I will feel nostalgic about/miss someone',
        example: 'I am going to miss that big old squishy butt.',
        context: 'The friends lament Ugly Naked Guy potentially moving away',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X1'
      },
      {
        phrase: 'if he\'s moving, maybe I should try to get his place',
        partOfSpeech: 'expression',
        meaning: 'if he is relocating, perhaps I should pursue/apply for his apartment',
        example: 'If he is moving, maybe I should try to get his place.',
        context: 'Ross considers applying for Ugly Naked Guy\'s apartment',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X2'
      },
      {
        phrase: 'the actual telephone thing',
        partOfSpeech: 'expression',
        meaning: 'a real telephone call/conversation using actual phones',
        example: 'Or we could do the actual telephone thing.',
        context: 'Monica jokes about using real phones instead of tin-can phones',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X3'
      },
      {
        phrase: 'my eye immediately goes to the big naked man',
        partOfSpeech: 'expression',
        meaning: 'my attention is drawn first to the obvious/distracting thing',
        example: 'That is because your eye immediately goes to the big naked man.',
        context: 'Chandler explains why Ross didn\'t notice the apartment\'s qualities',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X4'
      },
      {
        phrase: 'you better hurry up and fill out an application',
        partOfSpeech: 'expression',
        meaning: 'you should quickly apply before someone else does',
        example: 'You better hurry up and fill out an application, or I will beat you to it.',
        context: 'Monica encourages Ross to apply for the apartment',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X5'
      },
      {
        phrase: 'it doesn\'t matter who knows what',
        partOfSpeech: 'expression',
        meaning: 'the specific details of who is aware of what is irrelevant',
        example: 'It does not matter who knows what.',
        context: 'Rachel tries to simplify the complicated secret situation',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X6'
      },
      {
        phrase: 'enough of us know that we could just tell them we know',
        partOfSpeech: 'expression',
        meaning: 'there are now so many people aware that we have leverage',
        example: 'Now enough of us know that we could just tell them we know.',
        context: 'Rachel suggests revealing what they know to Chandler and Monica',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X7'
      },
      {
        phrase: 'or we could not tell them we know and have a little fun of our own',
        partOfSpeech: 'expression',
        meaning: 'alternatively, we could keep it secret and use this for entertainment',
        example: 'Or we could not tell them we know and have a little fun of our own.',
        context: 'Phoebe suggests playing a trick on Chandler and Monica',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X8'
      },
      {
        phrase: 'I got your secrets, I got their secrets. I got secrets of my own',
        partOfSpeech: 'expression',
        meaning: 'I am carrying the burden of knowing many secrets',
        example: 'I got your secrets, I got their secrets. I got secrets of my own, you know.',
        context: 'Joey expresses exhaustion from keeping secrets',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X9'
      },
      {
        phrase: 'my bedtime penguin pal',
        partOfSpeech: 'expression',
        meaning: 'my stuffed penguin companion/toy used for sleep',
        example: 'Well, you do not know about Hugsy, my bedtime penguin pal.',
        context: 'Joey reveals his secret: a stuffed penguin named Hugsy',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X10'
      },
      {
        phrase: 'I would use the strongest tool at my disposal: my sexuality',
        partOfSpeech: 'expression',
        meaning: 'I would use my sexual appeal as my most powerful weapon',
        example: 'I would use, you know, the strongest tool at my disposal. My sexuality.',
        context: 'Phoebe plans to flirt with Chandler to mess with him and Monica',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X11'
      },
      {
        phrase: 'in a sexless kind of way',
        partOfSpeech: 'expression',
        meaning: 'in a manner that is not sexually attractive',
        example: 'Phoebe has always thought you were charming in a sexless kind of way.',
        context: 'Monica tries to discourage Ross from believing Phoebe is hitting on him',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X12'
      },
      {
        phrase: 'the messers become the messees',
        partOfSpeech: 'expression',
        meaning: 'those who were playing tricks now become the victims of tricks',
        example: 'The messers become the messees.',
        context: 'Chandler and Monica plan their revenge on the group',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X13'
      },
      {
        phrase: 'I sent him a bribe to tip the scales in my direction',
        partOfSpeech: 'expression',
        meaning: 'I offered something of value to increase my chances',
        example: 'I sent him a bribe to tip the scales in my direction.',
        context: 'Ross admits he tried to influence Ugly Naked Guy\'s decision',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X14'
      },
      {
        phrase: 'a basket of mini muffins',
        partOfSpeech: 'expression',
        meaning: 'small baked goods as a gift/bribe',
        example: 'A basket of mini muffins.',
        context: 'Ross reveals his failed bribe strategy to get the apartment',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E14X15'
      }
    ]
  };

  var S_NUM = 5;
  var E_NUM = 14;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Coming Soon</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
