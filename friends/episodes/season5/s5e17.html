  <style>
    .expr-card { border-radius: 12px; padding: 18px 20px; margin: 0; }
    .expr-card:hover { transform: translateX(3px); }
    .expr-phrase { font-size: 1.06rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
    .expr-meaning { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 6px; }
    .expr-example { font-size: 0.82rem; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 8px; line-height: 1.6; }
    .expr-context { font-size: 0.77rem; color: var(--muted); margin-bottom: 8px; }
    .expr-num { font-size: 0.68rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent2); margin-bottom: 7px; }
    .expr-actions { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; margin-top: 6px; }
    .btn-youtube { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 800; cursor: pointer; transition: all 0.22s; text-decoration: none; font-family: inherit; }
    .btn-youtube:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,0,0,0.4); }
    .btn-youtube.pending { background: var(--card2); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; pointer-events: none; opacity: 0.6; }
    .placeholder-slot { opacity: 0.45; border-style: dashed; }
  </style>

<script>
  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'Season 5, Episode 17',
    description: '15 English expressions from Friends S5E17: Rachel accidentally kisses her Ralph Lauren interviewer, gets a second interview; Joey pursues a mysterious hot girl across buildings; Monica and Chandler compete with Gary and Phoebe; Ross meets his neighbor Jen.',
    expressions: [
      {
        phrase: 'nail the interview',
        partOfSpeech: 'phrasal verb',
        meaning: 'perform excellently/succeed in the interview',
        example: 'Well, if you nail the interview, you will get it.',
        context: 'Chandler encourages Rachel before her Ralph Lauren interview',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X1'
      },
      {
        phrase: 'good wrist action',
        partOfSpeech: 'expression',
        meaning: 'a strong, confident handshake technique',
        example: 'Very good handshake. Good wrist action.',
        context: 'Chandler compliments Rachel\'s handshake during interview practice',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X2'
      },
      {
        phrase: 'I\'m glad I\'m not Chandler',
        partOfSpeech: 'expression',
        meaning: 'I am relieved I am not receiving that painful handshake',
        example: 'Let\'s just say I am glad I am not Chandler.',
        context: 'Joey reacts to Monica\'s grip in the practice handshake',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X3'
      },
      {
        phrase: 'We\'ve lost visual contact with the suspect',
        partOfSpeech: 'expression',
        meaning: 'we can no longer see the person we were watching',
        example: 'We have lost visual contact with the suspect.',
        context: 'Gary (police officer) loses sight of something while on his date',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X4'
      },
      {
        phrase: 'just because some guy shot at a store clerk',
        partOfSpeech: 'expression',
        meaning: 'merely because of this criminal incident',
        example: 'Our date has to get cut short just because some guy shot at a store clerk.',
        context: 'Monica complains about Gary\'s police work interrupting their date',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X5'
      },
      {
        phrase: 'I can\'t keep your hands off each other',
        partOfSpeech: 'expression',
        meaning: 'you cannot resist touching/being intimate with each other',
        example: 'You can not keep your hands off each other.',
        context: 'Rachel describes the passionate beginning of relationships',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X6'
      },
      {
        phrase: 'get all your facts before you tell everybody',
        partOfSpeech: 'expression',
        meaning: 'verify information before spreading it around',
        example: 'Get all your facts before you tell everybody you are the only hot couple.',
        context: 'Monica corrects Phoebe\'s premature claim',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X7'
      },
      {
        phrase: 'our flame is on fire',
        partOfSpeech: 'idiom',
        meaning: 'our passion/relationship is extremely hot/intense',
        example: 'Our flame! It is on fire!',
        context: 'Monica defensively asserts that she and Chandler are also a hot couple',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X8'
      },
      {
        phrase: 'I totally misread him',
        partOfSpeech: 'expression',
        meaning: 'I completely misunderstood his intentions',
        example: 'I totally misread him and I, uh... kissed him.',
        context: 'Rachel realizes her mistake at the end of her interview',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X9'
      },
      {
        phrase: 'that kiss isn\'t looking like such a mistake now',
        partOfSpeech: 'expression',
        meaning: 'perhaps that kiss turned out to be beneficial',
        example: 'That kiss is not looking like such a mistake now, is it?',
        context: 'Monica suggests the kiss led to Rachel\'s second interview callback',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X10'
      },
      {
        phrase: 'I am not some hussy',
        partOfSpeech: 'expression',
        meaning: 'I am not a woman with loose moral standards',
        example: 'I am not some hussy who will just sleep around to get ahead.',
        context: 'Rachel defensively responds to her boss\'s inappropriate behavior',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X11'
      },
      {
        phrase: 'you got ink on your lip',
        partOfSpeech: 'expression',
        meaning: 'there is ink/mark on your lip',
        example: 'You got ink on your lip.',
        context: 'Chandler explains how he knew Rachel had written her phone number down',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X12'
      },
      {
        phrase: 'we\'re a hotter couple than we are',
        partOfSpeech: 'expression',
        meaning: 'they think they have a more passionate relationship',
        example: 'Gary and Phoebe think they are a hotter couple than we are.',
        context: 'Monica reveals why she feels competitive with the other couple',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X13'
      },
      {
        phrase: 'we\'ve gotta go have a lot of sex and prove them wrong',
        partOfSpeech: 'expression',
        meaning: 'we must be intimate to demonstrate we are hotter',
        example: 'So we have gotta go have a lot of sex and prove them wrong!',
        context: 'Monica proposes a competitive intimate challenge',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X14'
      },
      {
        phrase: 'you\'re the guy who wouldn\'t chip in for the handyman',
        partOfSpeech: 'expression',
        meaning: 'you\'re the one who refused to contribute money for the building employee',
        example: 'You are the guy who would not chip in for the handyman.',
        context: 'Jen (the hot girl) recognizes Ross from the building',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E17X15'
      }
    ]
  };

  var S_NUM = 5;
  var E_NUM = 17;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Coming Soon</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
