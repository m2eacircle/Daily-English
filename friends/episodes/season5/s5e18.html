  <link rel="stylesheet" href="../../../css/style.css">
  <style>
    .expr-card { border-radius: 12px; padding: 18px 20px; margin: 0; }
    .expr-card:hover { transform: translateX(3px); }
    .expr-phrase { font-size: 1.06rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
    .expr-meaning { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 6px; }
    .expr-example { font-size: 0.82rem; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 8px; line-height: 1.6; }
    .expr-context { font-size: 0.77rem; color: var(--muted); margin-bottom: 8px; }
    .expr-num { font-size: 0.68rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent2); margin-bottom: 7px; }
    .expr-actions { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; margin-top: 6px; }
    .btn-youtube { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 800; cursor: pointer; transition: all 0.22s; text-decoration: none; font-family: inherit; }
    .btn-youtube:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,0,0,0.4); }
    .btn-youtube.pending { background: var(--card2); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; pointer-events: none; opacity: 0.6; }
    .placeholder-slot { opacity: 0.45; border-style: dashed; }
  </style>
</head>

<script src="../../../js/app.js"></script>
<script>
  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'Season 5, Episode 18',
    description: '15 English expressions from Friends S5E18: Ben gets a commercial audition and Joey tags along wanting to play the dad; Joey and Ross compete over the role; Monica obsesses over party planning for Rachel\'s early surprise party; Rachel faces pressure to smoke at work to be included in decisions.',
    expressions: [
      {
        phrase: 'nail the interview',
        partOfSpeech: 'phrasal verb',
        meaning: 'perform excellently/succeed at the interview',
        example: 'If you nail the interview, you will get it.',
        context: 'Chandler encourages Rachel before her Ralph Lauren second interview',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X1'
      },
      {
        phrase: 'I\'m not his godfather',
        partOfSpeech: 'expression',
        meaning: 'I was never officially designated as his godfather',
        example: 'You are not his godfather.',
        context: 'Ross corrects Chandler\'s assumption about his role with Ben',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X2'
      },
      {
        phrase: 'you look nothing like Ben',
        partOfSpeech: 'expression',
        meaning: 'you do not physically resemble Ben at all',
        example: 'Joey, you look nothing like Ben.',
        context: 'Ross tells Joey he cannot play Ben\'s dad based on appearance',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X3'
      },
      {
        phrase: 'I take credit for them',
        partOfSpeech: 'expression',
        meaning: 'I will claim ownership of your ideas',
        example: 'And then I take credit for them. I am kidding.',
        context: 'Rachel\'s boss half-jokingly explains how the office works',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X4'
      },
      {
        phrase: 'but don\'t ever disagree with her again',
        partOfSpeech: 'expression',
        meaning: 'never contradict her in the future',
        example: 'Do not ever disagree with her again.',
        context: 'The boss warns Rachel not to challenge her colleague',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X5'
      },
      {
        phrase: 'you don\'t have to smoke',
        partOfSpeech: 'expression',
        meaning: 'it is not required or necessary for you to smoke',
        example: 'Rachel, you can go down there, you do not have to smoke.',
        context: 'Rachel\'s boss suggests she can get fresh air without smoking',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X6'
      },
      {
        phrase: 'or you could just do the easy thing and smoke',
        partOfSpeech: 'expression',
        meaning: 'you could take the simpler/more convenient path',
        example: 'Or you could just do the easy thing and smoke.',
        context: 'Rachel\'s boss subtly pushes her toward smoking',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X7'
      },
      {
        phrase: 'Tuscan-style finger food',
        partOfSpeech: 'expression',
        meaning: 'Italian appetizers served as small bites',
        example: 'I thought we would start with a Tuscan-style finger food.',
        context: 'Monica describes her party menu ideas',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X8'
      },
      {
        phrase: 'alphabetized list of all of my CDs',
        partOfSpeech: 'expression',
        meaning: 'organized collection of music arranged in order',
        example: 'For music, here is an alphabetized list of all of my CDs.',
        context: 'Monica shows her obsessively organized party planning',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X9'
      },
      {
        phrase: 'you\'re giving me cups?',
        partOfSpeech: 'expression',
        meaning: 'is that really all you are assigning me to handle?',
        example: 'Cups. You are giving me cups?',
        context: 'Ross reacts to Monica\'s minimal task assignment',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X10'
      },
      {
        phrase: 'I\'m in charge of cups and ice',
        partOfSpeech: 'expression',
        meaning: 'I am responsible for providing drinking cups and ice',
        example: 'Yeah, well, I am in charge of cups and ice.',
        context: 'Ross insists he has been given an important role',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X11'
      },
      {
        phrase: 'Monica\'s gonna rue the day',
        partOfSpeech: 'expression',
        meaning: 'Monica will regret/be sorry about the day she made that decision',
        example: 'And Monica is gonna rue the day that she put me in charge of cups and ice.',
        context: 'Ross humorously threatens Monica with cup/ice overload',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X12'
      },
      {
        phrase: 'that can\'t lead to anything good',
        partOfSpeech: 'expression',
        meaning: 'this situation will likely have negative results',
        example: 'The two of us competing. Well, that can not lead to anything good.',
        context: 'Joey expresses concern about competing with Ben',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X13'
      },
      {
        phrase: 'I just said that so you wouldn\'t let Ben do it',
        partOfSpeech: 'expression',
        meaning: 'I stated the opposite of what I actually believe to manipulate you',
        example: 'I just said that so you would not let Ben do it.',
        context: 'Joey reveals he was being manipulative and selfish',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X14'
      },
      {
        phrase: 'this is the smell of success',
        partOfSpeech: 'idiom',
        meaning: 'this is what achievement/accomplishment smells like',
        example: 'That is because I went down there and they were smoking. This is actually the smell of success.',
        context: 'Rachel justifies her smoking by framing it as necessary for career',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E18X15'
      }
    ]
  };

  var S_NUM = 5;
  var E_NUM = 18;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Coming Soon</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
