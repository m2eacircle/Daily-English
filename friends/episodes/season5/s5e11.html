<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends S5E11 &mdash; Daily English</title>
  <link rel="stylesheet" href="../../../css/style.css">
  <style>
    .expr-card { border-radius: 12px; padding: 18px 20px; margin: 0; }
    .expr-card:hover { transform: translateX(3px); }
    .expr-phrase { font-size: 1.06rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
    .expr-meaning { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin-bottom: 6px; }
    .expr-example { font-size: 0.82rem; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 8px; line-height: 1.6; }
    .expr-context { font-size: 0.77rem; color: var(--muted); margin-bottom: 8px; }
    .expr-num { font-size: 0.68rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent2); margin-bottom: 7px; }
    .expr-actions { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; margin-top: 6px; }
    .btn-youtube { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 800; cursor: pointer; transition: all 0.22s; text-decoration: none; font-family: inherit; }
    .btn-youtube:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,0,0,0.4); }
    .btn-youtube.pending { background: var(--card2); color: var(--muted); border: 1px solid var(--border); cursor: not-allowed; pointer-events: none; opacity: 0.6; }
    .placeholder-slot { opacity: 0.45; border-style: dashed; }
  </style>
</head>
<body>

    <div class="topbar-logo"><span class="logo-accent">Daily</span> <span class="logo-day">English</span></div>
  </div>
  <div class="topbar-right">
    <a class="m2ea-link" href="https://www.m2eacircle.com/entertainment/index.html" target="_blank" rel="noopener">
      <span class="m2ea-icon">&#127760;</span><span class="label">m2ea Circle</span>
    </a>
  </div>
</header>
<main>
  <div class="page-wrap">

      <button class="btn-nav home" onclick="goHome()">&#127968; <span data-i18n="nav.home">Home</span></button>
      <button class="btn-nav" onclick="window.location.href='../../seasons/season5.html'">&#9664; <span data-i18n="nav.back.season" data-i18n-vars='{"n":5}'>Back to Season 5</span></button>
    </nav>
    <nav class="breadcrumb">
      <a href="../../../index.html" data-i18n="bc.home">Home</a><span class="sep">&#8250;</span>

      <a href="../../seasons/season5.html">Season 5</a><span class="sep">&#8250;</span>

      <div class="page-header-thumb">
        <img src="../../images/s5e11.jpg" alt="S5E11"
          onerror="this.src='../../images/s5e11.png';this.onerror=function(){this.parentElement.innerHTML='&#127916;';};">
      </div>
      <div class="page-header-info">
        <div class="page-header-title">Friends &mdash; S5E11: Season 5, Episode 11</div>
        <div class="page-header-meta">15 English Expressions <div class="page-header-meta">Expressions coming soon.</div> Korean Translations</div>
        <div class="page-header-actions">
          <button class="btn-bm" data-bm-id="episode-friends-s5e11"
            onclick="toggleBookmark('episode','episode-friends-s5e11','📋 Friends S5E11','friends/episodes/season5/s5e11.html')">
            <span data-i18n="bm.episode">&#128278; Bookmark Episode</span>

      <div class="bookmark-chips" id="bookmarkChips"></div>

    <div class="section-label" data-i18n="episode.exprs.label" data-i18n-vars='{"s":5,"e":11}'>&#128172; 15 English Expressions &mdash; Season 5 Episode 11</div>

<script src="../../../js/i18n.js"></script>
<script src="../../../js/app.js"></script>
<script>
  /* ================================================================
     EPISODE DATA — edit this object to update expressions
     ----------------------------------------------------------------
     Each expression has:
       phrase       : the English expression
       partOfSpeech : e.g. 'idiom', 'phrasal verb', 'expression'
       meaning      : your explanation
       example      : an example sentence
       context      : scene context (optional, can be empty '')
       youtubeUrl   : paste YouTube link here when ready
     ----------------------------------------------------------------
     The page shows 15 slots. Add up to 15 objects in expressions[].
     Empty slots show as "Coming Soon" placeholders automatically.
  ================================================================ */
  var EP_DATA = {
    available: true,
    title: 'Season 5, Episode 11',
    description: '15 English expressions from Friends S5E11: New Year\'s resolutions (kissing midnight, new experiences daily, learning guitar, leather pants disaster).',
    expressions: [
      {
        phrase: 'go out on a limb',
        partOfSpeech: 'idiom',
        meaning: 'take a risk; make a bold statement',
        example: 'I am going to go out on a limb and say, No divorces in 99.',
        context: 'Ross states his New Year\'s resolution prediction',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X1'
      },
      {
        phrase: 'every day I am going to do one thing I have never done before',
        partOfSpeech: 'expression',
        meaning: 'my New Year\'s resolution is to try something new each day',
        example: 'Every day, I am going to do one thing I have never done before.',
        context: 'Ross announces his resolution',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X2'
      },
      {
        phrase: 'plummet to their deaths',
        partOfSpeech: 'phrasal verb',
        meaning: 'fall from great height and die',
        example: 'You would need to find a planeload of people whose resolution is to plummet to their deaths.',
        context: 'Monica teases Joey about his pilot resolution',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X3'
      },
      {
        phrase: 'your resolution should be not to make fun of your friends',
        partOfSpeech: 'expression',
        meaning: 'you should resolve to be nicer',
        example: 'Maybe your resolution should be not to make fun of your friends.',
        context: 'Joey suggests Monica improve her behavior',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X4'
      },
      {
        phrase: 'I\'ll bet you 50 bucks',
        partOfSpeech: 'expression',
        meaning: 'I will make a wager of 50 dollars',
        example: 'I will bet you 50 bucks you can not go the whole year without making fun of us.',
        context: 'Monica challenges Chandler to a bet',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X5'
      },
      {
        phrase: 'would you call Ted Koppel a gossip',
        partOfSpeech: 'expression',
        meaning: 'would you describe someone as a gossip if they share information publicly',
        example: 'Would you call Ted Koppel a gossip?',
        context: 'Rachel defends her information-sharing habit',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X6'
      },
      {
        phrase: 'I made up names for the way my hand looks',
        partOfSpeech: 'expression',
        meaning: 'I created descriptive names based on visual appearance',
        example: 'I made up names for the way my hand looks while I am doing them.',
        context: 'Phoebe explains her guitar chord naming system',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X7'
      },
      {
        phrase: 'Bear Claw',
        partOfSpeech: 'expression',
        meaning: 'Phoebe\'s name for a guitar chord based on hand shape',
        example: 'This is Bear Claw.',
        context: 'Phoebe teaches guitar using creative chord names',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X8'
      },
      {
        phrase: 'Turkey Leg',
        partOfSpeech: 'expression',
        meaning: 'Phoebe\'s name for a guitar chord based on hand shape',
        example: 'Okay, Turkey Leg.',
        context: 'Phoebe continues her guitar lesson',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X9'
      },
      {
        phrase: 'Old Lady',
        partOfSpeech: 'expression',
        meaning: 'Phoebe\'s name for a guitar chord based on hand shape',
        example: 'And Old Lady.',
        context: 'Phoebe\'s final example of her guitar chord method',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X10'
      },
      {
        phrase: 'you look like a freak',
        partOfSpeech: 'expression',
        meaning: 'your appearance is strange or bizarre',
        example: 'You look like a freak. Yeah, awful.',
        context: 'Monica and Rachel react to Ross\'s leather pants',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X11'
      },
      {
        phrase: 'it\'s like a volcano in here',
        partOfSpeech: 'expression',
        meaning: 'it is extremely hot; very intense heat',
        example: 'It is like a volcano in here.',
        context: 'Ross complains about overheating in his leather pants',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X12'
      },
      {
        phrase: 'I\'m burning up',
        partOfSpeech: 'expression',
        meaning: 'I am very hot; overheating',
        example: 'My God, these pants. I am burning up.',
        context: 'Ross is uncomfortable in the tight leather pants',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X13'
      },
      {
        phrase: 'don\'t come crying to me',
        partOfSpeech: 'expression',
        meaning: 'do not complain to me later if things go wrong',
        example: 'But do not come crying to me when everyone is sick and tired of hearing you play Bad, Bad Leroy Brown.',
        context: 'Phoebe warns Ross about finding a real guitar teacher',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X14'
      },
      {
        phrase: 'they must have shrunk from the sweat',
        partOfSpeech: 'expression',
        meaning: 'the leather pants became tighter due to perspiration',
        example: 'But they must have shrunk from the sweat or something.',
        context: 'Ross explains why his leather pants will not come back on',
        youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S5E11X15'
      }
    ]
  };

  var S_NUM = 5;
  var E_NUM = 11;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Coming Soon</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
        checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
</html>
