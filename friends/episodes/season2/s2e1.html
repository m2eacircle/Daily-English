      phrase: 'Excuse me. Move, move, move!',
      partOfSpeech: 'expression',
      meaning: 'An urgent, repeated command to clear a path or make space. The phrase combines politeness with escalating urgency, using repetition for emphasis. It conveys immediate need to navigate through people or obstacles.',
      meaning_ko: '길을 비우거나 공간을 만들기 위한 긴급한 반복된 명령입니다. 이 표현은 정중함을 긴급함과 결합하며, 강조를 위해 반복을 사용합니다. 그것은 사람들이나 장애물을 통해 탐색해야 할 즉각적인 필요를 전달합니다.',

      meaning_ko: '방금 말한 것이 문자적인 것이 아닌 관용적 언어라는 명확성입니다. 이 표현은 관례적이지 않은 단어 선택을 일반적인 표현으로 설명하여 방어합니다. 누군가가 관례적이지 않은 언어 선택을 정당화할 필요가 있을 때 사용됩니다.',

    {
      phrase: 'I like to be surprised.',
      partOfSpeech: 'expression',
      meaning: 'A statement expressing preference for unexpected events or information rather than advance notice. The phrase conveys enjoyment of suspense and not knowing what comes next. It reflects an appreciation for mystery and the element of surprise in life.',
      meaning_ko: '사전 통지보다는 예상치 못한 사건이나 정보에 대한 선호를 표현하는 진술입니다. 이 표현은 서스펜스의 즐김과 무엇이 다음에 올지 모르는 것을 전달합니다. 그것은 삶의 신비와 놀라움의 요소에 대한 감사를 반영합니다.',

      meaning_ko: '화자가 누군가와 낭만적인 연결을 추구하지 않았을 것이라는 진술입니다. 이 표현은 사전 매력이나 관심의 부족을 나타냅니다. 그것은 그 사람과의 낭만적 관여가 다른 상황에서 일어나지 않았을 것이라는 것을 전달합니다.',

    {
      phrase: 'You have to really wanna see it.',
      partOfSpeech: 'expression',
      meaning: 'A statement suggesting that something is only apparent if you actively look for it or want to believe it. The phrase implies the positive aspect is not obvious but requires effort to recognize. It conveys that optimism requires intentional perspective or willingness to see good.',
      meaning_ko: '무언가는 그것을 적극적으로 찾거나 믿기를 원하면 명백하다는 것을 시사하는 진술입니다. 이 표현은 긍정적인 측면이 명백하지 않지만 인식하려면 노력이 필요하다는 것을 암시합니다. 그것은 낙관주의가 의도적인 관점이나 선의를 보려는 의지를 요구한다는 것을 전달합니다.',

      context: 'Phoebe confesses to Monica that she gave herself a bad haircut.',
      context_ko: 'Phoebe는 Monica에게 자신이 자신에게 나쁜 헤어컷을 했다는 것을 고백합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S2E1X13'
    },
    {
      phrase: 'Rachel, how did this happen?',
      partOfSpeech: 'question',
      meaning: 'A confused inquiry about how an unexpected or dramatic situation came to be. The phrase expresses bewilderment at circumstances that have developed. It seeks understanding of the causes or chain of events that led to the present moment.',
      meaning_ko: '예상치 못한 드라마틱한 상황이 어떻게 발생했는지에 대한 혼란스러운 조회입니다. 이 표현은 발전한 상황에 대한 당혹감을 표현합니다. 그것은 현재의 순간으로 이어진 원인이나 일련의 사건을 이해하기를 추구합니다.',
      example: 'A: "I got my hair cut." B: "Rachel, how did this happen?"',
      example_ko: 'A: "난 헤어컷을 했어." B: "Rachel, 이건 어떻게 된 거야?"',
      context: 'Monica questions Rachel about how she ended up sleeping with Ross.',
      context_ko: 'Monica는 Rachel에게 그녀가 Ross와 자게 되었는지 묻습니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S2E1X14'
    },
    {
      phrase: 'I gotta get out of here!',
      partOfSpeech: 'expression',
      meaning: 'An urgent exclamation expressing immediate need to leave a location or situation. The phrase conveys anxiety or distress requiring escape. It\'s used when someone feels uncomfortable, overwhelmed, or emotionally stressed.',
      meaning_ko: '위치 또는 상황을 즉시 떠나야 할 필요를 표현하는 긴급한 감탄입니다. 이 표현은 탈출을 요구하는 불안이나 고통을 전달합니다. 누군가가 불편하거나, 압도되거나, 감정적으로 스트레스를 받을 때 사용됩니다.',
      example: 'A: "Are you okay?" B: "No, I gotta get out of here!"',
      example_ko: 'A: "넌 괜찮아?" B: "아니, 난 여기를 나가야 해!"',
      context: 'Rachel urgently leaves after processing the emotional reality of Ross\' relationship with Julie.',
      context_ko: 'Rachel은 Ross와 Julie의 관계의 감정적 현실을 처리한 후 서둘러 떠납니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S2E1X15'
    }
  ]
  };

  var S_NUM = 2;
  var E_NUM = 1;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
    checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
</body>
</html>
